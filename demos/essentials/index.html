<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odelle Essentials</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap">
<style>
/* Layout: calm editorial store on warm paper. Square-ish product frames on a light stone ground, sage buttons, serif headings, generous white space. */
:root{
  --paper:#f6f2ec;      /* page */
  --stone:#ece6dd;      /* bands, image ground */
  --sage-band:#cfd1c5;  /* curated looks band */
  --card:#fbf9f6;
  --ink:#2b2723;
  --ink-2:#4a443d;
  --mute:#80776d;
  --line:rgba(43,39,35,.13);
  --sage:#848e7c;       /* primary action */
  --sage-dk:#6f7968;
  --clay:#a8664b;       /* sale */
  --gold:#b8955a;       /* stars */
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Cormorant Garamond","Times New Roman",serif;
  --r:4px; --r-lg:6px;
  --max:1240px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
html[lang="ar"]{--f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--f-display:"Amiri","Times New Roman",serif}
*{box-sizing:border-box}
html{background:var(--paper);scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--paper)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.12;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--sage-dk);outline-offset:3px;border-radius:3px}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.serif{font-family:var(--f-display);font-weight:500}
html[lang="ar"] .serif{font-weight:400}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* top bar + header */
.topbar{background:var(--stone);color:var(--ink-2);font-size:12px;text-align:center;padding:7px 16px;letter-spacing:.02em}
.topbar b{font-weight:500}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(246,242,236,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:74px;gap:16px}
.hstart{display:flex;align-items:center;gap:28px;min-width:0}
.nav{display:flex;gap:24px;font-size:13.5px}
.nav a{padding:6px 0;color:var(--ink-2);position:relative}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a.on::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:var(--ink)}
.logo{display:grid;justify-items:center;line-height:1;direction:ltr;unicode-bidi:isolate}
.logo b{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:28px;letter-spacing:.2em;margin-inline-start:.2em}
.logo small{font-family:"Jost",sans-serif;font-size:8.5px;letter-spacing:.42em;margin-top:5px;margin-inline-start:.42em;color:var(--ink-2)}
.tools{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.tbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:background .2s}
.tbtn:hover{background:var(--stone)}
.badge{position:absolute;top:4px;inset-inline-end:2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--sage-dk);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;font-family:"Jost",sans-serif}
.lang{font-size:12px;height:30px;padding:0 11px;border:1px solid var(--line);border-radius:99px;margin-inline-start:6px;font-family:"Jost","IBM Plex Sans Arabic",sans-serif}
.lang:hover{border-color:var(--ink)}
@media (max-width:980px){.nav{display:none}.hide-sm{display:none}.logo b{font-size:23px}}

/* buttons + links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 26px;border-radius:var(--r);font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.btn .ico{width:17px;height:17px}
.btn-sage{background:var(--sage);color:#fff}
.btn-sage:hover{background:var(--sage-dk)}
.btn-line{border:1px solid var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.btn-block{width:100%}
.lnk{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.lnk .ico{width:18px;height:18px;transition:transform .25s}
.lnk:hover .ico{transform:translateX(4px)}
[dir="rtl"] .lnk:hover .ico{transform:scaleX(-1) translateX(4px)}
.ul{font-size:11.5px;text-decoration:underline;text-underline-offset:3px;letter-spacing:.04em}

/* hero */
.hero{position:relative;background:var(--stone);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;min-height:520px;align-items:center}
.hero .txt{padding-block:56px;display:grid;gap:22px;max-width:30em;position:relative;z-index:2}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,5.2vw,66px);line-height:1.05;letter-spacing:-.01em}
html[lang="ar"] .hero h1{line-height:1.35;font-size:clamp(36px,4.6vw,58px)}
.hero p{color:var(--ink-2);font-size:16px;font-weight:300;max-width:24em}
.hero .row{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-top:8px}
.hero .ph{position:absolute;inset-block:0;inset-inline-end:0;width:52%}
.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:30% 18%}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to var(--fade-to),var(--stone),transparent 26%)}
html{--fade-to:right}html[dir="rtl"]{--fade-to:left}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;min-height:0}.hero .ph{position:relative;width:auto;height:420px;margin-inline:calc(-1 * var(--gut));order:-1}.hero .ph::after{background:linear-gradient(to top,var(--stone),transparent 30%)}.hero .txt{padding-block:8px 40px}}

/* sections */
.sec{padding-block:56px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sh h2,.h2{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,3vw,34px)}
html[lang="ar"] .sh h2,html[lang="ar"] .h2{font-weight:400}

/* categories */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.cat{display:grid;gap:12px;justify-items:center;text-align:center;font-size:14px}
.cat .ph{width:100%;aspect-ratio:1;background:var(--stone);overflow:hidden;border-radius:var(--r)}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.cat:hover img{transform:scale(1.05)}
@media (max-width:900px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.cats{gap:10px}.cat{font-size:13px}}

/* curated looks band */
.band{background:var(--sage-band);border-radius:var(--r-lg);display:grid;grid-template-columns:240px 1fr;gap:20px;padding:22px;align-items:stretch}
.band .intro{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:18px 10px}
.band .intro h2{font-family:var(--f-display);font-size:clamp(30px,3.2vw,40px);font-weight:500;line-height:1.05}
html[lang="ar"] .band .intro h2{font-weight:400;line-height:1.3}
.band .intro p{color:var(--ink-2);font-size:14px;margin-top:12px;max-width:16em}
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.look{background:var(--card);display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
.look .ph{aspect-ratio:4/5;overflow:hidden;background:var(--stone)}
.look img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.look:hover img{transform:scale(1.04)}
.look .cap{text-align:center;padding:12px 8px 14px;display:grid;gap:4px}
.look .cap b{font-weight:400;font-size:14px}
@media (max-width:980px){.band{grid-template-columns:1fr}.band .intro{padding:4px}.looks{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.looks::-webkit-scrollbar{display:none}.look{flex:0 0 min(56%,240px);scroll-snap-align:start}}

.band>*,.duo>*,.split>*,.fav,.season{min-width:0}
/* new arrivals split */
.split{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.split .intro{display:grid;gap:12px;padding-top:6px}
.split .intro p{color:var(--ink-2);font-size:14px;max-width:14em}
.split .intro .lnk{margin-top:18px}
@media (max-width:980px){.split{grid-template-columns:1fr}.split .intro{grid-template-columns:1fr auto;align-items:end}.split .intro .lnk{margin:0}}

/* product grid + card */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 16px}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .pimg{position:relative;aspect-ratio:4/5;background:var(--stone);overflow:hidden;border-radius:var(--r)}
.card .pimg img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .pimg img{transform:scale(1.04)}
.tag{position:absolute;top:10px;inset-inline-start:10px;font-size:11px;padding:3px 9px;background:var(--card);border-radius:2px;letter-spacing:.03em}
.tag.s{background:var(--clay);color:#fff}
.heart{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(251,249,246,.85);color:var(--ink)}
.heart .ico{width:16px;height:16px}
.heart.on .ico{fill:var(--ink)}
.qadd{position:absolute;inset-inline:10px;bottom:10px;height:40px;border-radius:var(--r);background:rgba(251,249,246,.95);font-size:13px;opacity:0;transform:translateY(8px);transition:.3s}
.card:hover .qadd,.card:focus-within .qadd{opacity:1;transform:none}
@media (hover:none){.qadd{display:none}}
.card h3{font-family:var(--f-body);font-weight:400;font-size:14px;line-height:1.4}
.price{font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.price del{color:var(--mute);margin-inline-end:6px;font-size:.9em}
.price .now{color:var(--clay)}
.stars{display:inline-flex;align-items:center;gap:1px;color:var(--gold);font-size:12px}
.stars .ico{width:12px;height:12px;fill:currentColor;stroke:currentColor}
.stars .ico.off{fill:none;color:#cdbf9f}
.stars span{color:var(--mute);margin-inline-start:6px}
.sw{display:flex;gap:5px}
.sw i{width:11px;height:11px;border-radius:50%;border:1px solid var(--line)}

/* favorites + seasonal */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fav{background:var(--stone);border-radius:var(--r-lg);padding:24px}
.fav .head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.fav .head p{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.fav .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fav .card .pimg{background:var(--card)}
.fav .card h3{font-size:12.5px}
.fav .card .price{font-size:13px}
.season{position:relative;display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(120deg,var(--stone),#e2dbd0);border-radius:var(--r-lg);overflow:hidden;min-height:360px}
.season .txt{padding:30px 28px;display:flex;flex-direction:column;gap:12px;justify-content:center}
.season small{font-size:12px;color:var(--ink-2)}
.season h3{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,3vw,36px)}
html[lang="ar"] .season h3{font-weight:400}
.season p{color:var(--ink-2);font-size:14px}
.season .big{font-family:var(--f-display);font-size:clamp(34px,4vw,48px);line-height:1;margin-top:8px}
.season .btn{align-self:flex-start;margin-top:10px;height:42px;padding:0 18px;font-size:13px}
.season .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
@media (max-width:980px){.duo{grid-template-columns:1fr}}
@media (max-width:560px){.fav .row4{display:flex;overflow-x:auto;scrollbar-width:none}.fav .row4 .card{flex:0 0 42%}.season{grid-template-columns:1fr}.season .ph{height:300px;order:-1}}

/* service strip */
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-block:28px;border-top:1px solid var(--line)}
.svc div{display:flex;gap:14px;align-items:center;justify-content:center}
.svc .ico{width:28px;height:28px;stroke-width:1.2}
.svc b{display:block;font-weight:500;font-size:13.5px}
.svc small{color:var(--mute);font-size:12px}
@media (max-width:860px){.svc{grid-template-columns:1fr 1fr;gap:20px}.svc div{justify-content:flex-start}}

/* footer */
.ftr{background:var(--stone);padding-block:48px 24px;margin-top:20px}
.ftr .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.5fr;gap:28px}
.ftr .logo{justify-items:start}
.ftr .tagline{font-size:13px;color:var(--ink-2);margin-top:16px}
.ftr h4{font-family:var(--f-body);font-size:13px;font-weight:500;margin-bottom:12px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px;color:var(--ink-2)}
.ftr ul a:hover{color:var(--ink)}
.ftr .news p{font-size:13px;color:var(--ink-2);margin-bottom:12px}
.field{display:flex;border:1px solid var(--line);background:var(--card);border-radius:var(--r)}
.field input{flex:1;min-width:0;border:0;background:none;padding:12px 14px;outline:none;font-size:13.5px}
.field button{width:46px;display:grid;place-items:center}
.social{display:flex;gap:12px;margin-top:18px;color:var(--ink-2)}
.social .ico{width:18px;height:18px}
.ftr .base{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.ftr .base div{display:flex;gap:18px}
@media (max-width:980px){.ftr .cols{grid-template-columns:1fr 1fr}.ftr .cols>:first-child,.ftr .cols>:last-child{grid-column:1/-1}}

/* inner page head */
.phd{padding-block:40px 24px}
.crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:12px;flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.phd h1{font-family:var(--f-display);font-weight:500;font-size:clamp(34px,4.4vw,52px)}
html[lang="ar"] .phd h1{font-weight:400}
.phd p{color:var(--ink-2);margin-top:8px;max-width:40em}

/* shop toolbar */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px;margin-bottom:22px;border-block:1px solid var(--line);position:sticky;top:calc(74px + env(safe-area-inset-top,0px));z-index:20;background:rgba(246,242,236,.96)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:99px;border:1px solid var(--line);font-size:13px;white-space:nowrap;background:var(--card)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sel{height:34px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px}
.fbtn{display:inline-flex;align-items:center;gap:8px}
.fbtn .ico{width:15px;height:15px}
.fpanel{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:24px}
.fpanel h4{font-family:var(--f-body);font-size:13px;color:var(--mute);font-weight:500;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:44px;height:38px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);font-size:13px;font-family:"Jost",sans-serif;background:var(--card)}
.sz.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sz[disabled]{opacity:.35;text-decoration:line-through;pointer-events:none}
.cdot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);position:relative}
.cdot.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--ink)}
.count{font-size:13px;color:var(--mute);margin-inline-start:auto}
@media (max-width:760px){.fpanel{grid-template-columns:1fr}}
.empty{text-align:center;padding:64px 20px;border:1px dashed var(--line);border-radius:var(--r-lg);color:var(--mute);display:grid;gap:14px;justify-items:center}
.empty b{color:var(--ink);font-size:18px;font-weight:500}

/* product page */
.pdp>*,.co>*,.lookpage>*{min-width:0}
.buy .btn{min-width:0;padding-inline:14px;white-space:normal;text-align:center}
.pdp{display:grid;grid-template-columns:1.1fr 1fr;gap:52px;padding-block:24px 56px}
.gal{display:grid;grid-template-columns:72px 1fr;gap:12px;align-self:start;position:sticky;top:96px}
.thumbs{display:grid;gap:10px;align-content:start}
.thumbs button{aspect-ratio:4/5;overflow:hidden;border-radius:var(--r);border:1px solid transparent;opacity:.6;background:var(--stone)}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img,.main-img img{width:100%;height:100%;object-fit:cover}
.main-img{aspect-ratio:4/5;background:var(--stone);overflow:hidden;border-radius:var(--r);cursor:zoom-in}
.main-img img{transition:transform .5s ease}
.main-img.zoom img{transform:scale(2.1)!important}
.pinfo h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,3.4vw,40px);margin-top:8px}
html[lang="ar"] .pinfo h1{font-weight:400}
.pinfo .price{display:block;font-size:20px;margin-top:12px}
.pinfo .desc{color:var(--ink-2);margin-top:16px;max-width:34em;font-weight:300}
.opt{margin-top:24px}
.opt .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}
.opt .lbl span{color:var(--mute)}
.opt .lbl button{color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.buy{display:flex;gap:10px;margin-top:26px}
.buy .btn-sage{flex:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);height:46px;background:var(--card)}
.qty button{width:40px;height:100%;display:grid;place-items:center}
.qty button .ico{width:15px;height:15px}
.qty span{min-width:24px;text-align:center;font-family:"Jost",sans-serif}
.sq{width:46px;height:46px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.sq .ico{width:18px;height:18px}
.sq.on .ico{fill:var(--ink)}
.perks{display:grid;gap:10px;margin-top:22px;padding:16px;background:var(--stone);border-radius:var(--r);font-size:13.5px}
.perks div{display:flex;gap:12px;align-items:center}
.perks .ico{width:19px;height:19px}
.acc{margin-top:20px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 0;padding-inline-end:6px;font-size:14px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ico{width:15px;height:15px;transition:transform .25s}
.acc details[open] summary .ico{transform:rotate(45deg)}

/* drawers + overlays */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(43,39,35,.35);opacity:0;pointer-events:none;transition:opacity .3s}

.drawer{position:fixed;z-index:80;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--paper);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 40px rgba(0,0,0,.12)}
[dir="rtl"] .drawer{transform:translateX(-105%)}
.drawer.start{inset-inline-end:auto;inset-inline-start:0;transform:translateX(-105%)}
[dir="rtl"] .drawer.start{transform:translateX(105%)}
.drawer.show{transform:none!important}
.dh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-family:var(--f-display);font-weight:500;font-size:24px}
.db{flex:1;overflow-y:auto;padding:16px 22px}
.df{padding:16px 22px;border-top:1px solid var(--line);display:grid;gap:10px}
.x{width:38px;height:38px;display:grid;place-items:center;border-radius:50%}
.x:hover{background:var(--stone)}
.ship{font-size:13px;color:var(--ink-2)}
.bar{height:3px;background:var(--stone);margin-top:8px;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);transition:width .4s}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.line img{width:72px;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:var(--stone)}
.line h4{font-family:var(--f-body);font-size:14px;font-weight:400;line-height:1.4}

.line .end{display:flex;flex-direction:column;align-items:end;justify-content:space-between}
.mini{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);height:30px;margin-top:8px;background:var(--card)}
.mini button{width:28px;height:100%;display:grid;place-items:center}
.mini .ico{width:12px;height:12px}
.mini span{min-width:20px;text-align:center;font-size:13px;font-family:"Jost",sans-serif}
.rm{font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.tot{display:flex;justify-content:space-between;font-size:15px}

.mnav{display:grid}
.mnav a{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:var(--f-display);font-size:24px;border-bottom:1px solid var(--line)}
.mnav a .ico{width:17px;height:17px;color:var(--mute)}
.search{position:fixed;z-index:80;inset-inline:0;top:0;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);transform:translateY(-102%);transition:transform .38s cubic-bezier(.2,.7,.2,1);max-height:90vh;overflow:auto}
.search.show{transform:none}
.search .wrap{padding-block:22px 28px}
.sbox{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink);padding-bottom:10px}

.shint{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--mute)}

/* checkout */
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:24px;flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:8px}
.steps i{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-family:"Jost",sans-serif}
.steps .on{color:var(--ink)}

.steps .done i{background:var(--sage);border-color:var(--sage);color:#fff}

.co{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;padding-block:32px 56px;align-items:start}
.panel{padding:26px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}

.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:6px;font-size:12.5px;color:var(--mute)}
.form input,.form select,.form textarea{height:46px;border-radius:var(--r);border:1px solid var(--line);background:var(--paper);padding:0 14px;outline:none;font-size:14.5px}
.form textarea{height:120px;padding:12px 14px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--sage-dk)}
.form input.bad{border-color:var(--clay)}
.radio{display:flex;gap:12px;align-items:center;padding:15px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;font-size:14px;color:var(--ink)!important;background:var(--paper)}

.sum .line{grid-template-columns:56px 1fr auto}
.sum .line img{width:56px}
.sum .rows{display:grid;gap:10px;margin-top:14px;font-size:14px}
.sum .rows div{display:flex;justify-content:space-between}
.sum .grand{border-top:1px solid var(--line);padding-top:12px;font-size:17px}
.note{font-size:12.5px;color:var(--mute);display:flex;gap:8px;align-items:center;margin-top:12px}
.note .ico{width:15px;height:15px}
.co-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
@media (max-width:900px){.co{grid-template-columns:1fr}.co .sum{position:static;order:-1}.form{grid-template-columns:1fr}.panel{padding:20px}}

/* misc pages */
.done-card{max-width:620px;margin:56px auto;text-align:center;padding:44px 26px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line)}
.done-card .tick{width:60px;height:60px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--sage);color:#fff}
.done-card h1{font-family:var(--f-display);font-weight:500;font-size:clamp(30px,4vw,42px)}
.done-card p{color:var(--ink-2);margin-top:10px}
.done-card .ord{margin:22px auto;display:inline-grid;grid-template-columns:auto auto;gap:6px 24px;text-align:start;font-size:14px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:580px;border-radius:var(--r-lg);overflow:hidden;margin-block:36px;border:1px solid var(--line)}
.auth .ph img{width:100%;height:100%;object-fit:cover}
.auth .frm{padding:46px;background:var(--card);display:flex;flex-direction:column;justify-content:center}
.tabs{display:flex;gap:4px;padding:4px;border-radius:99px;border:1px solid var(--line);margin-bottom:24px;align-self:flex-start}
.tabs button{height:34px;padding:0 18px;border-radius:99px;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--paper)}

.dash{display:grid;grid-template-columns:220px 1fr;gap:28px;padding-block:32px 56px}

.st{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:#e7ebe2;color:var(--sage-dk)}

.story .ph img{width:100%;height:100%;object-fit:cover}
.story h2{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,3.4vw,40px);margin-bottom:16px}
.story p{color:var(--ink-2);font-weight:300;font-size:16px;max-width:32em}
.story p+p{margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.facts div{padding:16px;border-radius:var(--r);background:var(--stone)}
.facts b{display:block;font-family:var(--f-display);font-size:30px;font-weight:500}
.facts small{color:var(--mute)}
@media (max-width:860px){.story{grid-template-columns:1fr;gap:26px}.story.rev .ph{order:-1}}
.contact{display:grid;grid-template-columns:1fr 1.3fr;gap:36px;padding-block:36px 56px}
.cinfo{display:grid;gap:12px;align-content:start}

.cinfo h3{font-family:var(--f-body);font-size:15px;font-weight:500;margin-bottom:4px;display:flex;gap:10px;align-items:center}

/* toast + brand kit */
.toast{position:fixed;z-index:95;left:0;right:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(30px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:var(--r);background:var(--ink);color:var(--paper);font-size:13.5px;box-shadow:0 18px 40px -10px rgba(0,0,0,.35);transition:.35s}

/* ---- fitting room ---- */
.fit{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:40px;align-items:start;padding-bottom:70px}
.fit-stage{position:relative;aspect-ratio:2/3;background:var(--stone);border-radius:var(--r-lg);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}

.fit-z{position:absolute;inset:0}

.fit-tag{position:absolute;z-index:4;left:50%;transform:translateX(-50%);font-size:11.5px;background:rgba(251,249,246,.92);padding:3px 10px;border-radius:99px;white-space:nowrap;pointer-events:none}
.fit-tag.t{top:calc(31% + 22px)}.fit-tag.b{top:calc(70% + 22px)}
.fit-hint{position:absolute;z-index:4;inset:auto 0 12px 0;margin-inline:auto;width:max-content;max-width:90%;font-size:12.5px;background:rgba(43,39,35,.82);color:#fff;padding:6px 14px;border-radius:99px;transition:opacity .4s}

.fit-side h2{font-size:22px;margin:0 0 4px}
.fit-grp{margin-top:22px}
.fit-grp .lbl{font-size:13px;color:var(--mute);margin-bottom:10px}
.fit-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fit-pick{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;text-align:start;padding:8px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);transition:border-color .2s}
.fit-pick.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fit-pick .im{width:72px;aspect-ratio:3/4;border-radius:3px;overflow:hidden;background:var(--stone)}
.fit-pick .im img{width:100%;height:100%;object-fit:cover}
.fit-pick b{font-weight:500;font-size:13.5px;display:block;line-height:1.35}
.fit-sum{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.fit-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 0}
.fit-line select{height:38px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 8px}
.fit-line .btn{height:38px;padding:0 14px;font-size:13px}
.fit-total{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}

const ico = (n, cls="ico") => `<svg class="${cls}"><use href="#i-${n}"/></svg>`;
const arrow = () => ico("arrow","ico flip");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colorName = k => COLORS[k][L==="ar"?1:2];
const sizeLabel = s => s === "OS" ? t("onesize") : s;
const catName = c => tx(CATS.find(x=>x[0]===c).slice(1,3));
const firstSize = p => p.s.find(s=>!(p.out||[]).includes(s));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

/* ---------- components ---------- */
function priceHTML(p){ return `<span class="price">${p.was?`<del>${money(p.was)}</del><span class="now">${money(p.p)}</span>`:money(p.p)}</span>` }
function starsHTML(r, n){ return `<span class="stars" aria-label="${r} / 5">${[1,2,3,4,5].map(i=>ico("star", i<=Math.round(r)?"ico":"ico off")).join("")}<span class="num">(${n})</span></span>` }
function cardHTML(p, opts={}){
  const on = wish.includes(p.id);
  const tag = p.was ? `<span class="tag s">-${Math.round((1-p.p/p.was)*100)}%</span>` : p.tag==="new" ? `<span class="tag">${t("newTag")}</span>` : "";
  return `<article class="card">
    <a class="pimg" href="#p-${p.id}" aria-label="${esc(tx(p.n))}"><img src="${img(p.id)}" alt="${esc(tx(p.n))}" loading="lazy">${opts.noTag?"":tag}</a>
    <button class="heart ${on?"on":""}" data-wish="${p.id}" aria-pressed="${on}" aria-label="${t("wishlist")}">${ico("heart")}</button>
    ${opts.small?"":`<button class="qadd" data-quick="${p.id}">${t("quickAdd")} · ${sizeLabel(firstSize(p))}</button>`}
    <div><h3><a href="#p-${p.id}">${esc(tx(p.n))}</a></h3>${priceHTML(p)}</div>
    ${opts.stars?starsHTML(p.r,p.rv):""}
  </article>`;
}
function pageHead(title, sub, crumb){
  return `<section class="wrap phd"><div class="crumbs"><a href="#home">${t("home")}</a>${crumb?`<span>/</span><span>${crumb}</span>`:""}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</section>`;
}

function shopView(scope){
  let title, sub, list = P, chips = true;
  if(scope==="new"){ title = t("newArr"); sub = t("newP"); list = P.filter(p=>p.tag==="new"); }
  else if(scope==="sale"){ title = t("seasonT"); sub = t("offP"); list = P.filter(p=>p.was); chips = false; }
  else { title = tx(["تسوّق الكل","Shop all"]); sub = tx(["قطع أساسية بخامات طبيعية وألوان هادية.","Essentials in natural fabrics and quiet colours."]); }
  const s = shopState;
  let res = list.filter(p =>
    (s.type==="all" || p.c===s.type) &&
    (!s.sizes.length || p.s.some(z=>s.sizes.includes(z) && !(p.out||[]).includes(z))) &&
    (!s.colors.length || p.col.some(c=>s.colors.includes(c))) &&
    (!s.price || (()=>{const [a,b]=s.price.split("-").map(Number); return p.p>=a && p.p<b})())
  );
  if(s.sort==="low") res.sort((a,b)=>a.p-b.p);
  if(s.sort==="high") res.sort((a,b)=>b.p-a.p);
  if(s.sort==="new") res.sort((a,b)=>(b.tag==="new")-(a.tag==="new"));
  const cats = CATS.filter(c=>list.some(p=>p.c===c[0]));
  const allSizes = [...new Set(list.flatMap(p=>p.s))], allColors = [...new Set(list.flatMap(p=>p.col))];
  const nF = s.sizes.length + s.colors.length + (s.price?1:0);
  if(s.type!=="all") title = catName(s.type);
  return `${pageHead(title, sub, title)}
  <div class="wrap">
    <div class="tbar">
      <div class="chips" role="group">${chips?[["all",t("all"),t("all")],...cats].map(x=>`<button class="chip ${s.type===x[0]?"on":""}" data-type="${x[0]}" aria-pressed="${s.type===x[0]}">${L==="ar"?x[1]:x[2]}</button>`).join(""):""}</div>
      <button class="chip fbtn ${s.open||nF?"on":""}" data-act="toggleFilters" aria-expanded="${s.open}">${ico("filter")} ${t("filters")}${nF?` (${nF})`:""}</button>
      <label class="sr" for="sortSel">Sort</label>
      <select class="sel" id="sortSel">${t("sort").map(o=>`<option value="${o[0]}" ${s.sort===o[0]?"selected":""}>${L==="ar"?o[1]:o[2]}</option>`).join("")}</select>
    </div>
    ${s.open?`<div class="fpanel">
      <div><h4>${t("size")}</h4><div class="opts">${allSizes.map(z=>`<button class="sz ${s.sizes.includes(z)?"on":""}" data-fsize="${z}">${sizeLabel(z)}</button>`).join("")}</div></div>
      <div><h4>${t("color")}</h4><div class="opts">${allColors.map(c=>`<button class="cdot ${s.colors.includes(c)?"on":""}" style="background:${COLORS[c][0]}" data-fcolor="${c}" title="${colorName(c)}" aria-label="${colorName(c)}" aria-pressed="${s.colors.includes(c)}"></button>`).join("")}</div></div>
      <div><h4>${t("priceT")}</h4><div class="opts">${t("priceRanges").map(r=>`<button class="chip ${s.price===r[0]?"on":""}" data-fprice="${r[0]}">${L==="ar"?r[1]:r[2]}</button>`).join("")}</div>
      ${nF?`<button class="lnk ul" style="margin-top:16px" data-act="clearFilters">${t("clear")}</button>`:""}</div>
    </div>`:""}
    <div style="display:flex;margin:-6px 0 16px"><span class="count num">${res.length} ${t("items")}</span></div>
    ${res.length?`<div class="grid">${res.map(p=>cardHTML(p)).join("")}</div>`:`<div class="empty"><b>${t("noResults")}</b><p>${t("noResultsP")}</p><button class="btn btn-line" data-act="clearFilters">${t("clear")}</button></div>`}
  </div>`;
}

function totals(){
  const sub = bag.reduce((a,l)=>a+byId(l.id).p*l.qty,0);
  const ship = !bag.length ? 0 : (coState.ship==="exp" ? 12 : (sub>=BRAND.freeShipping?0:BRAND.shippingFee));
  return {sub, ship, total:sub+ship};
}
function sumHTML(){
  const {sub, ship, total} = totals();
  return `<div class="panel sum"><h2>${t("summary")}</h2>
    ${bag.map(l=>{const p=byId(l.id);return `<div class="line"><img src="${img(p.id)}" alt=""><div><h4>${esc(tx(p.n))}</h4><small>${colorName(l.color)} · ${sizeLabel(l.size)} · ×${l.qty}</small></div><span class="price">${money(p.p*l.qty)}</span></div>`}).join("")}
    <div class="rows num"><div><span class="mute">${t("subtotal")}</span><span>${money(sub)}</span></div><div><span class="mute">${t("shipping")}</span><span>${ship?money(ship):t("free")}</span></div><div class="grand"><span>${t("total")}</span><b>${money(total)}</b></div></div>
    <div class="note">${ico("lock")} ${t("demoPay")}</div></div>`;
}
V.checkout = () => {
  if(!bag.length) return `${pageHead(t("checkout"),"",t("checkout"))}<div class="wrap" style="padding-bottom:40px"><div class="empty">${ico("bag")}<b>${t("bagEmpty")}</b><p>${t("bagEmptyP")}</p><a class="btn btn-sage" href="#new">${t("newArr")}</a></div></div>`;
  const s = coState, i = s.info;
  const stepper = `<div class="steps">${t("steps").map((x,n)=>`${n?'<span class="sep"></span>':""}<span class="${n===s.step?"on":n<s.step?"done":""}"><i>${n<s.step?"✓":n+1}</i>${tx(x)}</span>`).join("")}</div>`;
  const f = (id, label, type="text", full=false, ac="") => `<label class="${full?"full":""}">${label}<input id="co_${id}" type="${type}" value="${esc(i[id]||"")}" ${ac?`autocomplete="${ac}"`:""} required></label>`;

    <label>${t("country")}<select id="co_co">${t("countries").map(c=>`<option value="${c[0]}" ${i.co===c[0]?"selected":""}>${L==="ar"?c[1]:c[2]}</option>`).join("")}</select></label></div>`;
  if(s.step===1) body = `<h2>${t("shipMethod")}</h2><div class="form">${t("shipOpts").map(o=>`<label class="radio full"><input type="radio" name="ship" value="${o[0]}" ${s.ship===o[0]?"checked":""}>${L==="ar"?o[1]:o[2]}<span class="r num">${o[3]?money(o[3]):(totals().sub>=BRAND.freeShipping?t("free"):money(BRAND.shippingFee))}</span></label>`).join("")}</div>`;
  if(s.step===2) body = `<h2>${t("payMethod")}</h2><div class="form">${t("payOpts").map(o=>`<label class="radio full"><input type="radio" name="pay" value="${o[0]}" ${s.pay===o[0]?"checked":""}>${L==="ar"?o[1]:o[2]}</label>`).join("")}
    ${s.pay==="card"?`<label class="full">${t("cardNo")}<input id="co_cn" inputmode="numeric" placeholder="4242 4242 4242 4242" autocomplete="off"></label><label>${t("exp")}<input id="co_ex" placeholder="12/28" autocomplete="off"></label><label>${t("cvc")}<input id="co_cv" placeholder="123" autocomplete="off"></label>`:""}</div><div class="note">${ico("lock")} ${t("demoPay")}</div>`;

    <div class="co-nav">${s.step?`<button type="button" class="btn btn-line" data-act="coBack">${t("back")}</button>`:`<a class="btn btn-line" href="#shop">${t("keep")}</a>`}<button class="btn btn-sage">${s.step===2?t("place"):t("next")} ${arrow()}</button></div></form></div>${sumHTML()}</div></div>`;

  const dk = "#" + [1,3,5].map(i=>Math.max(0,Math.round(parseInt(hex.slice(i,i+2),16)*0.85)).toString(16).padStart(2,"0")).join("");
  document.documentElement.style.setProperty("--sage-dk", dk);
  $$(".logo b").forEach(b => b.textContent = kitState.name);
}

/* ---------- overlays ---------- */
let lastFocus = null;
function openLayer(el){ lastFocus = document.activeElement; closeAll(true); el.classList.add("show"); $("#scrim").classList.add("show"); document.body.style.overflow = "hidden"; setTimeout(()=>{ const f = el.querySelector("input,button,a"); f && f.focus({preventScroll:true}) }, 60) }
function closeAll(keep){ $$(".drawer.show,.search.show").forEach(e=>e.classList.remove("show")); $("#scrim").classList.remove("show"); document.body.style.overflow = ""; if(!keep && lastFocus){ try{ lastFocus.focus({preventScroll:true}) }catch(e){} lastFocus = null } }
function renderBag(){
  const {sub} = totals(), left = Math.max(0, BRAND.freeShipping - sub);
  $("#bag").innerHTML = `<div class="dh"><h2 id="bagTitle">${t("bagT")} <span class="mute num" style="font-size:15px">(${bag.reduce((a,l)=>a+l.qty,0)})</span></h2><button class="x" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  ${bag.length?`<div class="db"><div class="ship">${left?t("toFree").replace("{x}",`<b class="num">${money(left)}</b>`):t("gotFree")}<div class="bar"><i style="width:${Math.min(100,sub/BRAND.freeShipping*100)}%"></i></div></div>
    ${bag.map((l,i)=>{const p=byId(l.id);return `<div class="line"><a href="#p-${p.id}"><img src="${img(p.id)}" alt=""></a><div><h4>${esc(tx(p.n))}</h4><small>${colorName(l.color)} · ${sizeLabel(l.size)}</small>
      <div class="mini"><button data-bq="${i}:-1" aria-label="-">${ico("minus")}</button><span>${l.qty}</span><button data-bq="${i}:1" aria-label="+">${ico("plus")}</button></div></div>
      <div class="end">${priceHTML({p:p.p*l.qty, was:p.was?p.was*l.qty:0})}<button class="rm" data-brm="${i}">${t("remove")}</button></div></div>`}).join("")}</div>
  <div class="df"><div class="tot num"><span>${t("subtotal")}</span><b>${money(sub)}</b></div><a class="btn btn-sage btn-block" href="#checkout">${t("checkout")}</a><button class="btn btn-line btn-block" data-act="close">${t("keep")}</button></div>`
  :`<div class="db"><div class="empty" style="margin-top:18px">${ico("bag")}<b>${t("bagEmpty")}</b><p>${t("bagEmptyP")}</p><a class="btn btn-sage" href="#new">${t("newArr")}</a></div></div>`}`;
}
function openBag(){ renderBag(); openLayer($("#bag")) }
function renderMenu(){
  $("#menu").innerHTML = `<div class="dh"><a class="logo" href="#home">${logoHTML()}</a><button class="x" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="db"><nav class="mnav">${t("nav").map(n=>`<a href="#${n[0]}">${L==="ar"?n[1]:n[2]} ${arrow()}</a>`).join("")}</nav>
  <div style="display:grid;gap:12px;margin-top:22px;font-size:14px">${CATS.map(c=>`<a href="#shop-${c[0]}" class="mute">${tx(c.slice(1,3))}</a>`).join("")}</div>
  <div style="display:grid;gap:14px;margin-top:26px;font-size:15px"><a href="#account" style="display:flex;gap:12px">${ico("user")} ${t("account")}</a><a href="#wishlist" style="display:flex;gap:12px">${ico("heart")} ${t("wishlist")} <span class="mute num">(${wish.length})</span></a><a href="#contact" style="display:flex;gap:12px">${ico("chat")} ${t("contact")}</a></div></div>`;
}
function renderSearch(){
  $("#search").innerHTML = `<div class="wrap"><div class="sbox">${ico("search")}<label class="sr" for="sInput">${tx(["بحث","Search"])}</label><input id="sInput" type="search" placeholder="${t("searchPh")}" autocomplete="off"><button class="x" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="shint">${t("popular")} ${t("popularList").map(x=>`<button class="chip" data-q="${L==="ar"?x[0]:x[1]}">${L==="ar"?x[0]:x[1]}</button>`).join("")}</div><div id="sResults"></div></div>`;
  searchResults("");
}
function searchResults(q){
  const ql = q.trim().toLowerCase();
  const res = ql ? P.filter(p => (p.n[0]+" "+p.n[1]+" "+p.c+" "+CATS.find(c=>c[0]===p.c)[1]).toLowerCase().includes(ql)) : P.filter(p=>p.tag==="new").slice(0,4);
  $("#sResults").innerHTML = `${ql?`<p class="mute" style="margin-top:16px;font-size:13px"><span class="num">${res.length}</span> ${t("resultsFor")}</p>`:""}${res.length?`<div class="sres">${res.slice(0,8).map(p=>cardHTML(p)).join("")}</div>`:`<div class="empty" style="margin-top:18px"><b>${t("noResults")}</b></div>`}`;
}
function openSearch(){ renderSearch(); openLayer($("#search")); setTimeout(()=>$("#sInput") && $("#sInput").focus(), 80) }
function renderKit(){
  $("#kit").innerHTML = `<div class="dh"><h2>${t("kitT")}</h2><button class="x" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="db kit"><p>${t("kitP")}</p>
    <div><h4><label for="kitName">${t("kitName")}</label></h4><div class="form" style="grid-template-columns:1fr"><input id="kitName" value="${esc(kitState.name)}" maxlength="16"></div></div>
    <div><h4>${t("kitAcc")}</h4><div class="accs">${ACCENTS.map(a=>`<button class="${kitState.accent===a[0]?"on":""}" style="background:${a[0]}" data-accent="${a[0]}" aria-label="${a[1]}" title="${a[1]}"></button>`).join("")}</div></div>
    <button class="btn btn-line" data-act="kitReset">${t("kitReset")}</button></div>`;
}

let toastT;
function toast(msg, action){
  const el = $("#toast"); el.querySelector("span").textContent = msg; const b = el.querySelector("button");
  if(action){ b.hidden = false; b.textContent = action[0]; b.onclick = () => { el.classList.remove("show"); action[1]() } } else b.hidden = true;
  el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 3200);
}
function pushBag(id, size, color, qty=1){ const i = bag.findIndex(l=>l.id===id && l.size===size && l.color===color); if(i>-1) bag[i].qty += qty; else bag.unshift({id,size,color,qty}) }
function addToBag(id, size, color, qty=1){ pushBag(id,size,color,qty); save(); $("#openBag").animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:420}); toast(`${t("added")}: ${tx(byId(id).n)}`, [t("viewBag"), openBag]) }
function toggleWish(id){
  const i = wish.indexOf(id); if(i>-1){ wish.splice(i,1); toast(t("removedW")) } else { wish.unshift(id); toast(t("savedW")) }
  save(); $$(`[data-wish="${id}"]`).forEach(b=>{ const on = wish.includes(id); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on) });
  if(curRoute==="wishlist" || (curRoute==="account" && accTab==="wish")) rerender();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const d = e.target.closest("[data-act],[data-wish],[data-quick],[data-type],[data-fsize],[data-fcolor],[data-fprice],[data-img],[data-pcolor],[data-psize],[data-pqty],[data-bq],[data-brm],[data-q],[data-accent],[data-acc],[data-auth],[data-addlook]");
  const a = e.target.closest("a[href^='#']");
  if(a && !d){ if(a.getAttribute("href")===location.hash){ closeAll(); window.scrollTo({top:0}) } return }
  const m = e.target.closest(".main-img"); if(m && !d){ m.classList.toggle("zoom"); if(!m.classList.contains("zoom")) rerender(); return }
  if(!d) return;
  const ds = d.dataset, pid = curRoute.startsWith("p-") ? curRoute.slice(2) : null;
  if(ds.wish){ e.preventDefault(); return toggleWish(ds.wish) }
  if(ds.quick){ const p = byId(ds.quick); return addToBag(p.id, firstSize(p), p.col[0]) }
  if(ds.type){ shopState.type = ds.type; return rerender() }
  if(ds.fsize){ const s = shopState.sizes; s.includes(ds.fsize) ? s.splice(s.indexOf(ds.fsize),1) : s.push(ds.fsize); return rerender() }
  if(ds.fcolor){ const s = shopState.colors; s.includes(ds.fcolor) ? s.splice(s.indexOf(ds.fcolor),1) : s.push(ds.fcolor); return rerender() }
  if(ds.fprice){ shopState.price = shopState.price===ds.fprice ? "" : ds.fprice; return rerender() }
  if(ds.img && pid){ pdpState[pid].img = +ds.img; return rerender() }
  if(ds.pcolor && pid){ pdpState[pid].color = ds.pcolor; return rerender() }
  if(ds.psize && pid){ pdpState[pid].size = ds.psize; return rerender() }
  if(ds.pqty && pid){ pdpState[pid].qty = Math.max(1, Math.min(9, pdpState[pid].qty + +ds.pqty)); return rerender() }
  if(ds.bq){ const [i,dl] = ds.bq.split(":").map(Number); bag[i].qty += dl; if(bag[i].qty<1) bag.splice(i,1); save(); return renderBag() }
  if(ds.brm){ bag.splice(+ds.brm,1); save(); return renderBag() }
  if(ds.q){ const i = $("#sInput"); i.value = ds.q; searchResults(ds.q); i.focus(); return }
  if(ds.accent){ kitState.accent = ds.accent; store.set("kit", kitState); applyKit(); return renderKit() }
  if(ds.acc){ accTab = ds.acc; return rerender() }
  if(ds.auth){ authTab = ds.auth; return rerender() }
  if(ds.addlook){ const l = LOOKS.find(x=>x.id===ds.addlook); l.items.forEach(id=>{ const p = byId(id); pushBag(id, lookSizes[id]||firstSize(p), p.col[0]) }); save(); return toast(`${t("lookAdded")} (${l.items.length})`, [t("viewBag"), openBag]) }
  switch(ds.act){
    case "close": return closeAll();
    case "toggleFilters": shopState.open = !shopState.open; return rerender();
    case "clearFilters": Object.assign(shopState, {sizes:[], colors:[], price:""}); return rerender();
    case "addPdp": { const st = pdpState[pid]; if(!st.size){ const er = $("#sizeErr"); er.hidden = false; er.scrollIntoView({block:"center", behavior:"smooth"}); return } return addToBag(pid, st.size, st.color, st.qty) }
    case "sizeGuide": { const f = $("#fitAcc"); f.open = true; f.scrollIntoView({block:"center", behavior:"smooth"}); return }
    case "coBack": coState.step--; return rerender();
    case "signOut": user = null; save(); return rerender();
    case "kitReset": kitState = {name:BRAND.name, accent:BRAND.accent}; store.set("kit", kitState); applyKit(); return renderKit();
  }
});
document.addEventListener("change", e => {
  const id = e.target.id || "";
  if(id==="sortSel"){ shopState.sort = e.target.value; rerender() }
  if(id.startsWith("ls_")) lookSizes[id.slice(3)] = e.target.value;
  if(e.target.name==="ship"){ coState.ship = e.target.value; rerender() }
  if(e.target.name==="pay"){ coState.pay = e.target.value; rerender() }
});
document.addEventListener("input", e => {
  if(e.target.id==="sInput") searchResults(e.target.value);
  if(e.target.id==="kitName"){ kitState.name = (e.target.value.trim() || BRAND.name).toUpperCase(); store.set("kit", kitState); applyKit() }
  if(e.target.classList.contains("bad")) e.target.classList.remove("bad");
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  const need = (ids, errId) => { let ok = true; ids.forEach(id=>{ const el = $("#"+id); if(el && (!el.value.trim() || (el.type==="email" && !/^\S+@\S+\.\S+$/.test(el.value)))){ el.classList.add("bad"); ok = false } }); $("#"+errId).hidden = ok; return ok };
  if(f==="news"){ const i = e.target.querySelector("input"); if(!/^\S+@\S+\.\S+$/.test(i.value)){ i.focus(); return } i.value = ""; return toast(t("subscribed")) }
  if(f==="contact"){ if(!need(["ct_n","ct_e","ct_m"],"ctErr")) return; e.target.reset(); return toast(t("sent")) }
  if(f==="auth"){ if(!need(["au_e","au_p"].concat(authTab==="up"?["au_n"]:[]),"auErr")) return; const em = $("#au_e").value.trim(); user = {email:em, name: authTab==="up" ? $("#au_n").value.trim() : em.split("@")[0]}; save(); return rerender() }
  if(f==="co"){
    if(coState.step===0){ const ids = ["fn","ln","em","ph","ad","ci"]; ids.forEach(id=>coState.info[id] = $("#co_"+id).value.trim()); coState.info.co = $("#co_co").value; if(!need(ids.map(i=>"co_"+i),"coErr")) return }
    if(coState.step<2){ coState.step++; rerender(); window.scrollTo({top:0, behavior:"smooth"}); return }
    const {total} = totals();
    orders.unshift({no:"OD-"+(10000+Math.floor(Math.random()*89999)), date:new Date().toISOString().slice(0,10), items:bag.reduce((a,l)=>a+l.qty,0), total, pay:coState.pay});
    if(!user && coState.info.em) user = {email:coState.info.em, name:coState.info.fn};
    bag = []; save(); coState.step = 0; location.hash = "confirmed";
  }
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeAll() });
document.addEventListener("mousemove", e => { const m = e.target.closest(".main-img.zoom"); if(!m) return; const r = m.getBoundingClientRect(); m.querySelector("img").style.transformOrigin = `${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%` });
$("#scrim").onclick = () => closeAll();
$("#openBag").onclick = openBag;
$("#openSearch").onclick = openSearch;
$("#burger").onclick = () => { renderMenu(); openLayer($("#menu")) };
$("#kitBtn").onclick = () => { renderKit(); openLayer($("#kit")) };
$("#langBtn").onclick = () => { L = L==="ar" ? "en" : "ar"; store.set("lang", L); chrome(); rerender() };
window.addEventListener("scroll", () => { const m = $("#mbar"); if(m.innerHTML){ const b = $("#addBtn"); m.classList.toggle("show", b ? b.getBoundingClientRect().bottom < 0 : false) } }, {passive:true});
window.addEventListener("hashchange", route);
chrome();
route();
</script>
</body>
</html>
