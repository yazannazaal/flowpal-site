<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Try the Look — Halden Supply (demo)</title>
<meta name="description" content="Six looks, styled head to toe. Explore the runway, isolate a look, and tap a pin to see the piece. A Flowpal demo store.">
<style>
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;padding:0;max-width:100%;font-family:Helvetica,Arial,sans-serif;color:#151413;background:#fff}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{color:inherit}
a{color:inherit;text-decoration:none}
button,a{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid #151413;outline-offset:4px}
[hidden]{display:none!important}

/* ---------- header ---------- */
.site-header{height:88px;padding:0 40px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;z-index:50}
.brand{margin-right:auto;display:inline-flex;align-items:center;gap:10px}
.brand svg{display:block;width:26px;height:26px}
.brand-word{font-size:15px;font-weight:700;letter-spacing:.28em;text-transform:uppercase}
.demo-flag{font-size:9px;letter-spacing:.16em;text-transform:uppercase;border:1px solid #151413;padding:3px 6px;border-radius:2px}
.site-header nav{display:flex;gap:28px;font-size:14px;font-weight:600}
.site-header nav a{padding:12px 0}
.site-header nav a:hover,.site-header nav a[aria-current]{text-decoration:underline;text-underline-offset:4px}
#open-bag{display:flex;align-items:center;justify-content:center;gap:5px;background:none;border:0;min-width:44px;min-height:44px;cursor:pointer}
#open-bag span{font-size:10px}

/* ---------- section ---------- */
.rw{
  --rw-text:#151413;--rw-muted:#66625c;--rw-accent:#0e0e0e;--rw-on-accent:#fff;--rw-line:#c8c8c8;
  --rw-h:46px;--rw-sub:12px;--rw-label:10px;--rw-chip:17px;--rw-ph:18px;--rw-pt:13px;--rw-price:12px;--rw-thumb:92px;--rw-pad:32px;
  --rw-ease:cubic-bezier(.16,1,.3,1);--rw-ease-silk:cubic-bezier(.65,0,.35,1);--rw-ease-spring:cubic-bezier(.34,1.56,.64,1);--rw-ease-sheet:cubic-bezier(.32,.72,0,1);
  --rw-speed:5s;--rw-model-h:560px;--rw-progress:.167;
  display:block;position:relative;color:var(--rw-text);background:#fff
}
.rw__sticky{height:var(--rw-frame-h,100svh);display:flex;flex-direction:column}
.rw__grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);width:100%}
.rw__left{position:relative;display:flex;flex-direction:column;background:#fff;overflow:hidden;min-height:0}
.rw__head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:44px 56px 0;z-index:5;position:relative}
.rw__intro{display:flex;flex-direction:column;gap:12px;max-width:640px}
.rw__title{margin:0;font-weight:400;font-size:var(--rw-h);line-height:1;letter-spacing:-.02em}
.rw__sub{margin:0;font-size:var(--rw-sub);line-height:1.55;color:var(--rw-muted);max-width:46ch}
.rw__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* stage */
.rw__stage{position:relative;flex:1 1 auto;min-height:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;outline:none;overflow:hidden;z-index:0}
.rw.is-dragging .rw__stage{cursor:grabbing}
.rw__stage:focus-visible{box-shadow:inset 0 0 0 2px var(--rw-accent)}
.rw__actors{position:absolute;inset:0;transition:opacity .7s var(--rw-ease) .2s}
.rw__model{position:absolute;left:0;bottom:0;transform-origin:50% 100%;will-change:transform,opacity;opacity:0}
.rw__figure{position:relative;height:var(--rw-model-h);aspect-ratio:.5625}
.rw__figure svg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.rw__hit{position:absolute;inset:0;z-index:1;background:transparent;border:0;border-radius:24px;cursor:pointer;padding:0}
.rw__hit:focus-visible{outline:2px solid var(--rw-accent);outline-offset:6px}
.rw__model.is-front .rw__hit{cursor:zoom-in}
.rw__shadow{position:absolute;left:52%;bottom:0;width:150%;height:9%;min-height:14px;max-height:46px;transform:translate(-50%,50%);filter:blur(2px);
  background:radial-gradient(closest-side,rgb(20 16 12/.30),rgb(20 16 12/.14) 45%,rgb(20 16 12/.04) 75%,rgb(20 16 12/0))}
.rw__sweep{position:absolute;inset:0;z-index:1550;mix-blend-mode:soft-light;pointer-events:none;overflow:hidden}
.rw__sweep::before{content:"";position:absolute;top:-20%;bottom:-20%;width:42%;opacity:0;transform:translateX(-130%) skewX(-12deg);
  background:linear-gradient(100deg,transparent,rgb(255 255 255/.25) 42%,rgb(255 255 255/.55) 50%,rgb(255 255 255/.25) 58%,transparent)}
.rw__stage.is-sweep .rw__sweep::before{animation:rw-sweep 1.5s var(--rw-ease-silk)}
@keyframes rw-sweep{0%{transform:translateX(-130%) skewX(-12deg);opacity:0}18%{opacity:1}100%{transform:translateX(330%) skewX(-12deg);opacity:0}}

/* cursor */
.rw--cursor .rw__stage,.rw--cursor .rw__stage *{cursor:none!important}
.rw__cursor{position:absolute;left:0;top:0;width:0;height:0;z-index:1700;pointer-events:none}
.rw__cursor-in{position:absolute;left:-42px;top:-42px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:var(--rw-text);
  border:1px solid color-mix(in srgb,#151413 28%,transparent);background:color-mix(in srgb,#fff 40%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transform:scale(.3);transition:transform .6s var(--rw-ease),opacity .35s,background .35s,border-color .35s,color .35s}
.rw__cursor-label{grid-area:1/1;font-size:10px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;white-space:nowrap;transition:opacity .25s,letter-spacing .7s var(--rw-ease)}
.rw__cursor-view{opacity:0}
.rw__cursor.is-on .rw__cursor-in{opacity:1;transform:scale(1)}
.rw__cursor.is-view .rw__cursor-drag{opacity:0}.rw__cursor.is-view .rw__cursor-view{opacity:1}
.rw__cursor.is-link .rw__cursor-in{transform:scale(.2);background:var(--rw-accent);border-color:transparent}
.rw__cursor.is-link .rw__cursor-label{opacity:0}
.rw.is-dragging .rw__cursor-in{transform:scale(.74);background:var(--rw-accent);border-color:var(--rw-accent);color:#fff}
.rw.is-dragging .rw__cursor-drag{opacity:1;letter-spacing:.42em}.rw.is-dragging .rw__cursor-view{opacity:0}

/* phone walk line */
.rw__walk{display:none;position:absolute;left:50%;bottom:8px;z-index:1600;width:min(140px,38%);transform:translateX(-50%)}
.rw__walk-line{display:block;height:2px;background:color-mix(in srgb,#151413 14%,transparent);position:relative;overflow:hidden}
.rw__walk-line::after{content:"";position:absolute;inset:0;background:var(--rw-accent);transform-origin:left;transform:scaleX(var(--rw-progress));transition:transform 1.1s var(--rw-ease)}

/* controls */
.rw__controls{display:flex;align-items:center;gap:20px;padding:6px 44px 30px;z-index:5;position:relative}
.rw__icon{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--rw-text);position:relative;cursor:pointer;padding:0;flex:0 0 auto}
.rw__icon::before{content:"";position:absolute;inset:2px;border-radius:50%;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__icon:hover::before{opacity:.22;transform:scale(1)}
.rw__icon svg{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
[data-rw-prev]:hover svg{transform:translateX(-4px)}[data-rw-next]:hover svg{transform:translateX(4px)}
.rw__icon:active svg{transform:scale(.88)}
.rw__icon:focus-visible{outline:2px solid var(--rw-accent);outline-offset:2px;border-radius:4px}
.rw__auto .i-pause{display:none}.rw.is-playing .rw__auto .i-pause{display:block}.rw.is-playing .rw__auto .i-play{display:none}
.rw__ticks{flex:1;display:flex;gap:6px;min-width:0}
.rw__tick{flex:0 1 44px;min-width:14px;height:44px;display:flex;flex-direction:column;justify-content:center;gap:9px;color:var(--rw-muted);text-align:left;
  background:none;border:0;padding:0;cursor:pointer;transition:flex-basis .8s cubic-bezier(.2,1.25,.3,1),color .3s}
.rw__tick[aria-current="true"]{flex:0 0 190px;color:var(--rw-text)}
.rw__tick:hover{color:var(--rw-text)}
.rw__tick-bar{display:block;height:2px;width:100%;overflow:hidden;position:relative;background:color-mix(in srgb,#151413 14%,transparent);transition:transform .5s var(--rw-ease)}
.rw__tick:hover .rw__tick-bar{transform:scaleY(1.5)}
.rw__tick-bar::after{content:"";position:absolute;inset:0;background:#151413;transform:scaleX(0);transform-origin:left;transition:transform 1s var(--rw-ease),opacity .4s,background .4s}
.rw__tick.is-past .rw__tick-bar::after{transform:scaleX(1);opacity:.35}
.rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(1);background:var(--rw-accent);opacity:1}
.rw.is-playing .rw__tick[aria-current="true"] .rw__tick-bar::after{transform:scaleX(0);transition:none}
.rw.is-playing .rw__tick.is-run .rw__tick-bar::after{animation:rw-fill var(--rw-speed) linear forwards}
@keyframes rw-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rw__tick-label{font-size:var(--rw-label);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rw__tick-name{display:none}
.rw__tick[aria-current="true"] .rw__tick-name{display:inline;animation:rw-name-in 1.1s var(--rw-ease) .1s backwards}
@keyframes rw-name-in{from{opacity:0;letter-spacing:.34em}}

/* panel */
.rw__panel{position:relative;background:#fff;border-left:1px solid var(--rw-line);min-height:0}
.rw__panel-inner{position:absolute;inset:0;display:flex;flex-direction:column}
.rw__panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:44px var(--rw-pad) 18px}
.rw__panel-title{margin:0;font-weight:400;font-size:var(--rw-ph);line-height:1.1}
.rw__label{font-size:var(--rw-label);letter-spacing:.16em;text-transform:uppercase;color:var(--rw-muted);white-space:nowrap}
.rw__label.is-swap{animation:rw-fade .8s var(--rw-ease)}
@keyframes rw-fade{from{opacity:0;transform:translateY(6px)}}
.rw__look-panel{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.rw__mhead{display:none}
.rw__items{list-style:none;margin:0;padding:6px var(--rw-pad) 20px;display:flex;flex-direction:column;overflow-y:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;scrollbar-width:thin}
.rw__item{position:relative;display:grid;grid-template-columns:var(--rw-thumb) minmax(0,1fr) 44px;column-gap:18px;align-items:center;padding:18px 0;border-top:1px solid var(--rw-line)}
.rw__item:last-child{border-bottom:1px solid var(--rw-line)}
.rw__item::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rw-accent);transform:scaleX(0);transform-origin:left;transition:transform .9s var(--rw-ease)}
.rw__item.is-hot::after{transform:scaleX(1)}
.rw__media{position:relative;display:block;aspect-ratio:4/5;overflow:hidden;background:color-mix(in srgb,#151413 5%,#fff)}
.rw__media svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.4s var(--rw-ease)}
.rw__num{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:rgb(255 255 255/.9);color:#151413;font-size:10px;font-weight:600;
  transition:background .3s,color .3s,transform .45s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-hot .rw__num{background:var(--rw-accent);color:#fff;transform:scale(1.12)}
@media (hover:hover){.rw__item:hover::after{transform:scaleX(1)}.rw__item:hover .rw__media svg{transform:scale(1.07)}.rw__item:hover .rw__num{background:var(--rw-accent);color:#fff;transform:scale(1.12)}}
.rw__tag{position:absolute;top:11px;left:8px;z-index:2;display:flex;flex-direction:column;transform-origin:10px 0;pointer-events:none}
.rw__tag::before{content:"";width:1px;height:11px;margin-left:10px;background:color-mix(in srgb,#151413 50%,transparent)}
.rw__tag-text{background:#151413;color:#fff;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 6px;border-radius:2px}
@media (hover:hover){.rw__item:hover .rw__tag{animation:rw-swing 1.4s cubic-bezier(.3,.7,.4,1)}}
@keyframes rw-swing{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}45%{transform:rotate(-7deg)}65%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.rw__info{display:flex;flex-direction:column;gap:5px;min-width:0}
.rw__type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rw-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw__name{font-size:var(--rw-pt);font-weight:500;line-height:1.3;align-self:flex-start;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .7s var(--rw-ease)}
.rw__item:hover .rw__name{background-size:100% 1px}
.rw__price{font-size:var(--rw-price);display:flex;gap:8px;color:var(--rw-text)}
.rw__add{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;align-self:end;position:relative;cursor:pointer;padding:0}
.rw__add svg{grid-area:1/1;transition:transform .55s cubic-bezier(.2,1.6,.4,1),opacity .2s}
.rw__add .i-check,.rw__add .i-spin{opacity:0}
.rw__add::before{content:"";position:absolute;inset:4px;border-radius:20px;border:1px solid currentColor;opacity:0;transform:scale(.55);transition:transform .7s var(--rw-ease),opacity .4s}
.rw__add:hover::before,.rw__item.is-picking .rw__add::before{opacity:.22;transform:scale(1)}
.rw__item.is-picking .rw__add .i-plus{transform:rotate(45deg)}
.rw__item.is-loading .rw__add .i-plus{opacity:0}
.rw__item.is-loading .rw__add .i-spin{opacity:1;animation:rw-spin .8s linear infinite}
@keyframes rw-spin{to{transform:rotate(360deg)}}
.rw__item.is-loading .rw__media::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgb(255 255 255/.5) 50%,transparent 70%);animation:rw-shimmer 1.1s infinite}
@keyframes rw-shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.rw__item.is-added .rw__add{cursor:default}
.rw__item.is-added .rw__add .i-plus{opacity:0}
.rw__item.is-added .rw__add .i-check{opacity:1;color:var(--rw-accent);animation:rw-pop .6s cubic-bezier(.2,1.6,.4,1)}
.rw__item.is-added .rw__add .i-check path{stroke-dasharray:24;stroke-dashoffset:24;animation:rw-draw .7s var(--rw-ease) .1s forwards}
.rw__item.is-added .rw__add::before{opacity:0}
.rw__item.is-added .rw__add::after{content:"";position:absolute;inset:4px;border-radius:20px;border:1px solid var(--rw-accent);animation:rw-burst 1s var(--rw-ease) forwards}
@keyframes rw-pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rw-draw{to{stroke-dashoffset:0}}
@keyframes rw-burst{from{transform:scale(.55);opacity:.9}to{transform:scale(1.7);opacity:0}}

/* picker */
.rw__picker{grid-column:1/-1;display:flex;flex-direction:column;gap:14px;padding-top:16px;animation:rw-drop .7s var(--rw-ease)}
@keyframes rw-drop{from{opacity:0;transform:translateY(-8px)}}
.rw__picker-head{display:none}
.rw__opt{border:0;padding:0;margin:0;animation:rw-rise .8s var(--rw-ease) backwards}
.rw__opt-name{font-size:11px;margin-bottom:8px;padding:0}
.rw__pills{display:flex;flex-wrap:wrap;gap:8px}
.rw__pill{position:relative}
.rw__pill input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.rw__pill span{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:40px;padding:0 14px;border-radius:30px;border:1px solid var(--rw-line);font-size:11px;
  transition:background .3s,color .3s,border-color .3s,transform .45s var(--rw-ease-spring)}
.rw__pill:hover span{border-color:#151413}
.rw__pill input:checked+span{background:#151413;color:#fff;border-color:#151413}
.rw__pill:active span{transform:scale(.94)}
.rw__pill input:focus-visible+span{outline:2px solid var(--rw-accent);outline-offset:2px}
.rw__confirm{min-height:46px;border:0;border-radius:0;background:#151413;color:#fff;font-size:11px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;cursor:pointer;animation:rw-rise .8s var(--rw-ease) .16s backwards;transition:transform .4s cubic-bezier(.2,1.5,.4,1)}
.rw__confirm:hover,.rw__cta:hover{transform:translateY(-1px)}
.rw__confirm::before,.rw__cta::before{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;transform:translateX(-140%) skewX(-18deg);background:linear-gradient(100deg,transparent,rgb(255 255 255/.26) 50%,transparent)}
.rw__confirm:hover::before,.rw__cta:hover::before{transform:translateX(260%) skewX(-18deg);transition:transform 1.1s var(--rw-ease)}
@keyframes rw-rise{from{opacity:0;transform:translateY(14px)}}
.pick-scrim{display:none}

/* bundle */
.rw__bundle{padding:20px var(--rw-pad) 30px;display:flex;flex-direction:column;gap:16px;background:#fff;border-top:1px solid var(--rw-line)}
.rw__msg{margin:0;font-size:11px;line-height:1.45;color:var(--rw-accent);animation:rw-rise .6s var(--rw-ease)}
.rw__msg:empty{display:none}
.rw__bundle-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.rw__bundle-copy{display:flex;flex-direction:column;gap:3px}
.rw__bundle-title{font-size:13px;font-weight:500}
.rw__bundle-note{font-size:11px;color:var(--rw-muted)}
.rw__bundle-price{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.rw__bundle-price s{font-size:11px;color:var(--rw-muted)}
.rw__bundle-price strong{font-weight:400;font-size:16px}
.rw__cta{position:relative;overflow:hidden;min-height:56px;width:100%;border:0;border-radius:0;background:#151413;color:#fff;font-size:13px;font-weight:500;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:transform .6s var(--rw-ease),background .45s,color .45s,box-shadow .6s var(--rw-ease)}
.rw__cta:hover{transform:translateY(-2px);box-shadow:0 18px 34px -22px color-mix(in srgb,#151413 80%,transparent)}
.rw__cta:active{transform:scale(.985)}
.rw__cta .i-arrow{transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.rw__cta:hover .i-arrow{transform:translateX(4px)}
.rw__cta-m,.rw__cta-done{display:none}
.rw__look-panel.is-complete .rw__cta{background:var(--rw-accent);animation:rw-glow 1.8s var(--rw-ease);cursor:default}
.rw__look-panel.is-complete .rw__cta-add,.rw__look-panel.is-complete .rw__cta-m,.rw__look-panel.is-complete .i-arrow{display:none!important}
.rw__look-panel.is-complete .rw__cta-done{display:inline;animation:rw-rise .7s var(--rw-ease)}
@keyframes rw-glow{from{box-shadow:0 0 0 0 color-mix(in srgb,#0e0e0e 55%,transparent)}to{box-shadow:0 0 0 16px transparent}}
.demo-note{font-size:10px;letter-spacing:.06em;color:var(--rw-muted);margin:0}

/* entrance per look */
.rw__look-panel.is-in .rw__item{animation:rw-item-in 1.1s var(--rw-ease) backwards;animation-delay:calc(var(--i)*85ms + 140ms)}
.rw__look-panel.is-in .rw__media{animation:rw-curtain 1.2s var(--rw-ease) backwards;animation-delay:calc(var(--i)*85ms + 200ms)}
.rw__look-panel.is-in .rw__bundle-row{animation:rw-rise 1s var(--rw-ease) .38s backwards}
@keyframes rw-item-in{from{opacity:0;transform:translateY(26px);filter:blur(8px)}}
@keyframes rw-curtain{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}

/* popup */
.rw__lb{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s linear .95s}
.rw__lb::before{content:"";position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .6s var(--rw-ease) .15s}
.rw--zoom .rw__lb{visibility:visible;pointer-events:auto;transition:none}
.rw--zoom .rw__lb::before{opacity:1;transition:opacity .45s}
.rw--zoom .rw__actors,.rw--zoom .rw__head,.rw--zoom .rw__walk{opacity:0;pointer-events:none;transition:opacity .35s}
.rw__head,.rw__walk{transition:opacity .7s var(--rw-ease) .2s}
.rw__lb-stage{position:absolute;inset:88px 48px 48px;display:flex;align-items:flex-end;justify-content:center;cursor:zoom-out}
.rw__lb-model{position:relative;flex:0 0 auto;cursor:default;transition:transform .95s var(--rw-ease)}
.rw__lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:32px 32px 0 56px;opacity:0;transform:translateY(-10px)}
.rw--zoom .rw__lb-top{opacity:1;transform:none;transition:opacity .8s .35s,transform 1s var(--rw-ease) .35s}
.rw__lb-cap{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.rw__lb-kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--rw-muted);font-variant-numeric:tabular-nums}

  background:rgb(255 255 255/.88);backdrop-filter:blur(10px);color:#151413;font-size:11px;font-weight:500;letter-spacing:.04em;line-height:1;box-shadow:0 10px 26px -12px rgb(0 0 0/.4);

.rw__pin.is-hot::after,.rw__pin:focus-visible::after{opacity:1;transform:translate(0,-50%)}

/* bag + toast */
#bag-status{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#151413;color:#fff;padding:12px 20px;font-size:12px;z-index:2147483002;opacity:0;transition:opacity .25s;pointer-events:none}

<script>
/* =====================================================================

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);

const T = DATA.text;
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
const money = v => new Intl.NumberFormat(DATA.locale, { style: "currency", currency: DATA.currency }).format(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const mod = (a, n) => ((a % n) + n) % n;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad2 = n => String(n).padStart(2, "0");

/* Silhouette (viewBox 90x160, 9:16) coloured from the look's products. */
function figureSVG(look, i) {
  const [top, bottom, shoe] = look.items.map(id => DATA.products[id]);
  const sk = look.skin, lean = [0, 1.5, -1, 2, -1.5, 1][i % 6];
  const hood = top.kind === "hood"

    const cards = $$(".rw__item", panel);
    if (cards.length >= 2 && cards.every(c => c.classList.contains("is-added"))) { panel.classList.add("is-complete"); $("[data-rw-msg]", panel).textContent = ""; }
  }
  function addAll(panel) {
    if (panel.classList.contains("is-complete")) return;
    const cta = $("[data-rw-all]", panel), msg = $("[data-rw-msg]", panel);
    if (cta.classList.contains("is-loading")) return;
    msg.textContent = "";
    const open = $$(".rw__item", panel).filter(c => !c.classList.contains("is-added"));
    const ready = open.filter(c => c.dataset.touched), pending = open.filter(c => !c.dataset.touched);
    if (ready.length) { cta.classList.add("is-loading"); addCards(ready, () => cta.classList.remove("is-loading")); }
    if (pending.length) {
      (mobile ? pending.slice(0, 1) : pending).forEach(c => openPicker(c, true));
      msg.textContent = fmt(T.pickSize, { items: pending.map(c => $(".rw__name", c).textContent).join(", ") });
    }
  }

  /* ---------- clicks ---------- */
  let suppress = 0;
  document.addEventListener("click", e => {
    if (performance.now() < suppress && stage.contains(e.target)) { e.preventDefault(); e.stopPropagation(); return; }
    const t = e.target.closest("button, [data-rw-lb-stage]"); if (!t) return;
    if (t.matches("[data-rw-pick-close]")) return closeSheets();
    if (!sec.contains(t)) return;
    if (t.matches("[data-rw-zoom-close]")) return closeZoom();
    if (t.matches("[data-rw-lb-stage]") && e.target === t) return closeZoom();
    if (t.matches("[data-rw-next]")) return next();
    if (t.matches("[data-rw-prev]")) return prev();
    if (t.matches("[data-rw-tick]")) return go(+t.dataset.rwTick);
    if (t.matches("[data-rw-auto]")) { if (!playing) engaged = false; return play(!playing); }
    if (t.matches("[data-rw-pin]")) { engage(); return hot(+t.dataset.rwPin, true); }
    if (t.matches("[data-rw-go]")) {
      let k = mod(+t.dataset.rwGo - target, N); if (k >= N / 2) k -= N; k = Math.round(k);
      return k === 0 ? openZoom() : moveTo(Math.round(target) + k);
    }
    const card = t.closest(".rw__item");
    if (t.closest(".rw__panel")) engage();
    if (t.matches("[data-rw-confirm]") && card) { card.dataset.touched = "1"; return addCards([card]); }
    if (t.matches("[data-rw-add]") && card && !card.classList.contains("is-added") && !card.classList.contains("is-loading")) return openPicker(card, !card.classList.contains("is-picking"));
    if (t.matches("[data-rw-all]")) return addAll(t.closest("[data-rw-panel]"));
  }, true);
  sec.addEventListener("change", e => { const c = e.target.closest(".rw__item"); if (c) { c.dataset.touched = "1"; engage(); } });

  /* ---------- panel hover ---------- */
  const col = $("[data-rw-panel-col]");
  col.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") panelHover = true; });
  col.addEventListener("pointerleave", () => { panelHover = false; restartBar(); });
  col.addEventListener("pointerover", e => { if (e.pointerType !== "mouse") return; const c = e.target.closest(".rw__item"); if (c) hot(+c.dataset.rwCard); });
  col.addEventListener("pointerout", e => { const c = e.target.closest(".rw__item"); if (c && !c.contains(e.relatedTarget)) hot(0); });

  /* ---------- drag / swipe ---------- */
  let ds = null;
  stage.addEventListener("pointerdown", e => {
    if (zoomed || (e.pointerType === "mouse" && e.button !== 0)) return;
    ds = { x: e.clientX, y: e.clientY, t: target, id: e.pointerId, samples: [{ x: e.clientX, time: e.timeStamp }], on: false };
  });
  stage.addEventListener("pointermove", e => {
    if (!ds || e.pointerId !== ds.id) return;
    if (e.pointerType === "mouse" && !(e.buttons & 1)) return endDrag(e);
    const dx = e.clientX - ds.x, dy = e.clientY - ds.y;
    if (!ds.on) {
      if (Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)) { ds = null; return; }
      if (Math.abs(dx) > 8 && Math.abs(dx) > 1.2 * Math.abs(dy)) { ds.on = dragging = true; sec.classList.add("is-dragging"); try { stage.setPointerCapture(e.pointerId); } catch {} }
      else return;
    }
    ds.samples.push({ x: e.clientX, time: e.timeStamp }); if (ds.samples.length > 6) ds.samples.shift();
    target = ds.t - dx / unit; kick();
  });
  function endDrag(e) {
    if (!ds) return;
    const d = ds; ds = null;
    if (!d.on) return;
    dragging = false; sec.classList.remove("is-dragging"); suppress = performance.now() + 60;
    const s0 = d.samples[0], s1 = d.samples[d.samples.length - 1];
    const vx = s1.time > s0.time ? (s1.x - s0.x) / (s1.time - s0.time) : 0, dx = (e.clientX ?? s1.x) - d.x, from = Math.round(d.t);
    if (mobile) moveTo(Math.abs(dx) > 30 || Math.abs(vx) > .3 ? from - (dx > 0 ? 1 : -1) : from);
    else {
      let i = Math.round(target - vx * 160 / unit);
      if (i === from && Math.abs(vx) > .3) i = from - Math.sign(vx);
      moveTo(clamp(i, from - 2, from + 2));
    }
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  let wAcc = 0, wLock = 0;
  stage.addEventListener("wheel", e => {
    if (Math.abs(e.deltaX) <= Math.abs(e.deltaY) || zoomed) return;
    e.preventDefault(); if (performance.now() < wLock) return;
    wAcc += e.deltaX;
    if (Math.abs(wAcc) > 45) { wAcc > 0 ? next() : prev(); wAcc = 0; wLock = performance.now() + 520; }
  }, { passive: false });

  stage.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    const open = $(".rw__item.is-picking", sec);
    if (mobile && open) { closeSheets(); $("[data-rw-add]", open).focus(); }
    else if (zoomed) closeZoom();
  });

  /* ---------- custom cursor ---------- */
  const cur$ = $("[data-rw-cursor]");
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
    sec.classList.add("rw--cursor");
    let cx = 0, cy = 0, tx = 0, ty = 0, cRaf = 0, entered = false;
    const loop = () => {
      const f = reduced ? 1 : .18; cx += (tx - cx) * f; cy += (ty - cy) * f;
      cur$.style.transform = `translate3d(${cx}px,${cy}px,0)`;
      cRaf = Math.hypot(tx - cx, ty - cy) > .2 ? requestAnimationFrame(loop) : 0;
    };
    stage.addEventListener("pointermove", e => {
      if (e.pointerType !== "mouse") return;
      const r = stage.getBoundingClientRect(); tx = e.clientX - r.left; ty = e.clientY - r.top;
      if (!entered) { entered = true; cx = tx; cy = ty; cur$.classList.add("is-on"); }
      const hit = e.target.closest(".rw__hit, .rw__pin"), front = hit && hit.closest(".rw__model.is-front");
      cur$.classList.toggle("is-view", !dragging && !!front && !zoomed);
      cur$.classList.toggle("is-link", !dragging && !!hit && !front);
      if (!cRaf) cRaf = requestAnimationFrame(loop);
    });
    stage.addEventListener("pointerleave", () => { entered = false; cur$.classList.remove("is-on", "is-link", "is-view"); });
  } else cur$.remove();

  /* ---------- lifecycle ---------- */
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(measure, 120); });
  if ("ResizeObserver" in window) new ResizeObserver(() => measure()).observe(stage);
  new IntersectionObserver(es => { visible = es[0].isIntersecting; if (visible) kick(); }, { threshold: 0 }).observe(sec);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { kick(); restartBar(); } });

  sec.classList.add("rw--js");
  measure();
  setIndex(0);
  if (reduced) sec.classList.add("is-revealed");
  else requestAnimationFrame(() => requestAnimationFrame(() => sec.classList.add("is-revealed")));
  kick();
  if (!reduced) play(true);
})();

/* bag dialog */
bag.load(); bag.render();
const dlg = $("#bag-dialog");
$("#open-bag").addEventListener("click", () => { bag.render(); dlg.showModal(); });
$("#close-bag").addEventListener("click", () => dlg.close());
$("#clear-bag").addEventListener("click", () => { bag.items = []; bag.save(); bag.render(); });
dlg.addEventListener("click", e => {
  const rm = e.target.closest("[data-remove]");
  if (rm) { bag.items.splice(+rm.dataset.remove, 1); bag.save(); bag.render(); return; }
  const r = dlg.getBoundingClientRect();
  if (e.target === dlg && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) dlg.close();
});
</script>
</body>
