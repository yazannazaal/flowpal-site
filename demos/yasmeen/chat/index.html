<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>مساعد الياسمين · عرض توضيحي</title>
<style>
  :root {
    --page: #eef0f3;
    --surface: #ffffff;
    --ink: #050505;
    --muted: #65676b;
    --line: #e4e6eb;
    --bot-bubble: #f0f0f0;
    --user-bubble: #0a7cff;
    --user-ink: #ffffff;
    --accent: #0a7cff;
    --chip-ink: #0a7cff;
    --font: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
  }
  /* Instagram-style colours */
  body.ig {
    --user-bubble: linear-gradient(135deg, #7638fa 0%, #d300c5 55%, #ff0069 100%);
    --accent: #7638fa;
    --chip-ink: #262626;
    --bot-bubble: #efefef;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px max(12px, env(safe-area-inset-left)) 16px max(12px, env(safe-area-inset-right));
    gap: 12px;
  }
  .topbar { width: 100%; max-width: 420px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .note { font-size: 13px; color: var(--muted); }
  .switch { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .switch button { border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); min-height: 36px; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  .phone {
    width: 100%;
    max-width: 420px;
    height: min(820px, calc(100dvh - 110px));
    min-height: 520px;
    background: var(--surface);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #1b1b1b; color: #f1c35b; display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
  body.ig .avatar { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #d300c5; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; color: var(--muted); }
  .icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: var(--accent); display: grid; place-items: center; }
  .icon-btn:hover { background: #f2f2f2; }

  .thread { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
  .row { display: flex; flex-direction: column; gap: 6px; }
  /* Arabic chat apps mirror the layout: your own messages on the left, the store's on the right */
  .row.user { align-items: flex-end; }
  .row.bot { align-items: flex-start; }
  .bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 15px; line-height: 1.55; white-space: pre-line; overflow-wrap: anywhere; }
  .row.bot .bubble { background: var(--bot-bubble); color: var(--ink); }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-ink); }

  .cards { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 2px 2px 6px; scroll-snap-type: x mandatory; align-self: stretch; }
  .card { flex: 0 0 220px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; }
  .photo { width: 160px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 18px; background: #f4f4f4; display: block; }
  .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #f4f4f4; display: block; }
  .card .no-img { width: 100%; aspect-ratio: 1 / 1; background: #f0f0f0; }
  .card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .card .name { font-weight: 700; font-size: 14px; line-height: 1.4; }
  .card .price { font-size: 14px; }
  .card .price s { color: var(--muted); font-size: 12px; margin-inline-start: 6px; }
  .card .reason { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .card .actions { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .card .actions button, .card .actions a {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--accent); background: transparent; border: 0;
    border-top: 1px solid var(--line); min-height: 42px; cursor: pointer; text-decoration: none; display: grid; place-items: center;
  }
  .card .actions > :first-child { border-top: 0; }
  .cart-note { font-size: 12px; color: var(--muted); }

  .typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--bot-bubble); border-radius: 18px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a9a9a; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  .quick { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px 2px; }
  .quick:empty { display: none; }
  .quick button { flex-shrink: 0; font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--chip-ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 38px; }
  body:not(.ig) .quick button { border-color: var(--accent); }

  form.composer { display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  form.composer input { flex: 1; min-width: 0; border: 0; background: #f0f2f5; border-radius: 999px; padding: 11px 16px; font: inherit; font-size: 15px; outline-offset: 2px; }
  form.composer button { border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; min-height: 44px; padding: 0 6px; }
  form.composer button:disabled, form.composer input:disabled { opacity: 0.5; cursor: not-allowed; }

  .banner { margin: 0 12px; padding: 10px 12px; border-radius: 12px; background: #fff8e1; color: #6b4e00; font-size: 13px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .banner button { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; background: #6b4e00; color: #fff; padding: 7px 12px; cursor: pointer; }
  .error { align-self: center; font-size: 12px; color: #b3261e; background: #fdecea; padding: 6px 10px; border-radius: 10px; }

  dialog { border: 0; border-radius: 16px; padding: 20px; max-width: 380px; width: calc(100% - 32px); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
  dialog label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  dialog input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; direction: ltr; }
  dialog p { font-size: 13px; color: var(--muted); line-height: 1.6; }
  dialog .row-btns { display: flex; gap: 8px; justify-content: flex-start; margin-top: 14px; }
  dialog button { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  dialog button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }

  :focus-visible { outline: 3px solid #8ab4ff; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } .thread { scroll-behavior: auto; } }
</style>
</head>
<body>
  <div class="topbar">
    <span class="note">عرض توضيحي: هيك بيبان المساعد للزبون</span>
    <div class="switch" role="group" aria-label="شكل التطبيق">
      <button type="button" data-skin="messenger" aria-pressed="true">ماسنجر</button>
      <button type="button" data-skin="ig" aria-pressed="false">إنستغرام</button>
    </div>
  </div>

  <main class="phone">
    <header class="chat-head">
      <div class="avatar" aria-hidden="true">ي</div>
      <div class="who">
        <b>مؤسسة الياسمين للأدوات المنزلية</b>
        <span id="status">بيرد فورًا</span>
      </div>
      <button class="icon-btn" type="button" id="restart" aria-label="محادثة جديدة" title="محادثة جديدة">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="icon-btn" type="button" id="settings" aria-label="الإعدادات" title="الإعدادات">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </header>

    <div class="banner" id="demo-banner" hidden>
      <span>محادثة مسجّلة من البوت الحقيقي. اربط n8n من الإعدادات عشان تجرّبه مباشر.</span>
      <button type="button" id="play">▶ شغّل العرض</button>
    </div>

    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="quick" id="quick"></div>

    <form class="composer" id="composer">
      <label for="msg" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">رسالتك</label>
      <input id="msg" autocomplete="off" maxlength="500" placeholder="اكتب رسالة…">
      <button type="submit" id="send">إرسال</button>
    </form>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <label for="webhook">رابط شات n8n</label>
      <input id="webhook" type="url" placeholder="https://xxx.app.n8n.cloud/webhook/…/chat">
      <p>من n8n افتح node «When chat message received» وانسخ <b>Chat URL</b>. لازم يكون الـ workflow مفعّل (Active).<br>اتركه فاضي عشان تشوف المحادثة المسجّلة.</p>
      <div class="row-btns">
        <button type="submit" class="primary" value="save">حفظ</button>
        <button type="submit" value="cancel">إلغاء</button>
      </div>
    </form>
  </dialog>

<script>
"use strict";

// ✏️ Optional: put the n8n Chat URL here so the page is live for everyone who opens it.
const DEFAULT_CHAT_URL = "https://n8n-ffs0.srv1955533.hstgr.cloud/webhook/71a0cf92-e4a2-492a-a65a-301544665904/chat";

// A real conversation recorded from the bot (used when no n8n URL is set).
const DEMO = [{"user": "مرحبا", "text": "أهلا وسهلا فيك بالياسمين للأدوات المنزلية 🌸 أنا مساعد الياسمين.\nبساعدك تلاقي أي إشي من منتجات المحل، بقارنلك بين الاختيارات، بفرجيك الصور وبجهزلك الطلب.\nشو بتدور عليه اليوم؟ مثلًا فناجين قهوة حلوة، كاسات شاي، طناجر، صواني تقديم، أطقم صحون فاخرة…", "products": [], "quick_replies": ["فناجين قهوة حلوة", "كاسات شاي", "طناجر", "صواني تقديم"], "cart": null}, {"user": "بدي طقم صحون للضيوف", "text": "هاي أنسب أطقم صحون فاخرة عندنا:\nبدك أقارن بيناتهم ولا أضيف واحد عالسلة؟", "products": [{"id": "2087", "name": "طقم صحون بورسلان 18 قطعة ملون", "price": 90, "max_price": null, "original_price": 160, "reason": "عليه خصم 44% حسب الموقع، الطقم 18 قطع، بورسلان حسب اسم المنتج", "image_url": "https://yasmeenhome.com/upload/10-2026/product/IMG_3007-450px.png", "product_url": "https://yasmeenhome.com/?app=product.show.2087"}, {"id": "1952", "name": "طقم صحون 33قطعة بورسلان", "price": 75, "max_price": null, "original_price": 120, "reason": "عليه خصم 38% حسب الموقع، الطقم 33 قطع، بورسلان حسب اسم المنتج", "image_url": "https://yasmeenhome.com/upload/10-2026/product/e9708275-450px.jpeg", "product_url": "https://yasmeenhome.com/?app=product.show.1952"}, {"id": "2088", "name": "طقم صحون بورسلان 18 قطعة ملون", "price": 100, "max_price": null, "original_price": 160, "reason": "عليه خصم 38% حسب الموقع، الطقم 18 قطع، بورسلان حسب اسم المنتج", "image_url": "https://yasmeenhome.com/upload/10-2026/product/IMG_3008-450px.png", "product_url": "https://yasmeenhome.com/?app=product.show.2088"}], "quick_replies": ["قارن بين الأول والثاني", "ضيف الأول عالسلة", "في أرخص؟", "اعرض اختيارات كمان"], "cart": null}, {"user": "ضيف الأول عالسلة", "text": "تمام ✅ ضفت 1 × طقم صحون بورسلان 18 قطعة ملون عالسلة.\nإجمالي السلة هلأ: 90 ₪ (عدد القطع: 1).\nبدك تكمل الطلب ولا أفرجيك إشي بيلبق معه، زي طقم كاسات عصير زجاج منقش؟", "products": [], "quick_replies": ["اكمل الطلب", "شو بيلبق معه؟", "اعرض السلة"], "cart": {"item_count": 1, "subtotal": 90}, "image_url": "https://yasmeenhome.com/upload/10-2026/product/IMG_3007-450px.png"}, {"user": "قديش التوصيل لنابلس؟", "text": "التوصيل لـ نابلس (الضفة): 20 ₪.\nالطلبات الكبيرة ممكن يكون عليها رسوم توصيل إضافية، والفريق بيبلغك قبل الإرسال.\nبقدر أساعدك بإشي ثاني؟", "products": [], "quick_replies": ["رسوم التوصيل", "طريقة الدفع", "سياسة التبديل"], "cart": {"item_count": 1, "subtotal": 90}}, {"user": "بدي اكمل الطلب", "text": "عشان أجهز طلبك محتاج:\n• الاسم\n• رقم الموبايل\n• المدينة/المنطقة\n• العنوان بالتفصيل\nابعتهم برسالة وحدة إذا بدك (مثال: الاسم أحمد، موبايل 0599xxxxxx، رام الله، شارع ...).", "products": [], "quick_replies": [], "cart": {"item_count": 1, "subtotal": 90}}, {"user": "سماح عودة 0599123456 نابلس رفيديا بجوار صيدلية الشفاء", "text": "هاد ملخص طلبك:\n• 1 × طقم صحون بورسلان 18 قطعة ملون — 90 ₪\nإجمالي المنتجات: 90 ₪\nالتوصيل لـ نابلس (الضفة): 20 ₪. الطلبات الكبيرة ممكن يكون عليها رسوم إضافية والفريق بيبلغك قبل.\nمدة التوصيل: من يوم ليومين، ومندوب التوصيل بيتصل فيك قبل ما يوصل.\nالدفع: الدفع نقدًا عند الاستلام.\nملاحظة: ما في تبديل ولا إرجاع، فافحص الطلب كويس لما يوصلك وقبل ما تدفع للمندوب.\nالاسم: سماح عودة — الموبايل: 059****456 — العنوان: نابلس، رفيديا بجوار صيدلية الشفاء\nالطلب بيوصل لفريق الياسمين للمراجعة، وبيتواصلوا معك لتأكيد توفر المنتجات وموعد التوصيل قبل الإرسال.\nبدك أبعت الطلب للفريق ولا بدك تعدّل إشي؟ (نعم / لا)", "products": [], "quick_replies": ["نعم، ابعت الطلب", "لا، بدي أعدل"], "cart": {"item_count": 1, "subtotal": 90}}, {"user": "نعم", "text": "وصل طلبك لفريق الياسمين ✅ رقم الطلب: YH-20261027-23I490\nإجمالي المنتجات: 90 ₪ + رسوم التوصيل، والدفع نقدًا عند الاستلام.\nالفريق بيراجع الطلب وبيتواصل معك لتأكيد توفر المنتجات وموعد التوصيل قبل ما ينبعت.\nبدك أساعدك بإشي ثاني؟", "products": [], "quick_replies": ["كمل تسوق", "أحكي مع موظف"], "cart": null}];

const ORDINALS = ["الأول", "الثاني", "الثالث", "الرابع", "الخامس", "السادس"];
const els = {
  thread: document.getElementById("thread"),
  quick: document.getElementById("quick"),
  form: document.getElementById("composer"),
  input: document.getElementById("msg"),
  send: document.getElementById("send"),
  banner: document.getElementById("demo-banner"),
  play: document.getElementById("play"),
  dialog: document.getElementById("settings-dialog"),
  webhook: document.getElementById("webhook"),
};

const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch { /* storage blocked: keep in memory only */ } },
};

// The bot address: https, or http on this computer for testing.
function validChatUrl(value) {
  try {
    const url = new URL(String(value));
    if (url.protocol === "https:" || (url.protocol === "http:" && ["localhost", "127.0.0.1"].includes(url.hostname))) return url.href;
  } catch { /* not a URL */ }
  return "";
}

let chatUrl = validChatUrl(store.get("yasmeen.chatUrl") ?? DEFAULT_CHAT_URL);
let sessionId = newSessionId();
let busy = false;
let demoRun = 0;

function newSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
}

// Only plain https links and images are ever put on the page.
function safeUrl(value) {
  try {
    const url = new URL(String(value));
    return url.protocol === "https:" ? url.href : null;
  } catch { return null; }
}

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollDown() { els.thread.scrollTop = els.thread.scrollHeight; }

function addUser(text) {
  const row = el("div", { class: "row user" });
  row.append(el("div", { class: "bubble" }, text));
  els.thread.append(row);
  scrollDown();
}

function showTyping() {
  const row = el("div", { class: "row bot", id: "typing" });
  const dots = el("div", { class: "typing", "aria-label": "بيكتب…" });
  dots.append(el("i"), el("i"), el("i"));
  row.append(dots);
  els.thread.append(row);
  scrollDown();
}
function hideTyping() { document.getElementById("typing")?.remove(); }

function formatPrice(p) {
  if (p.price == null) return "السعر بيتأكد من الفريق";
  return p.max_price ? `${p.price} - ${p.max_price} ₪` : `${p.price} ₪`;
}

function addBot(reply, { interactive = true } = {}) {
  const row = el("div", { class: "row bot" });
  const text = String(reply.text || "").replace(/\*\*/g, "").trim();
  // an item just added to the cart comes back as one photo, not a card with buttons
  const photo = safeUrl(reply.image_url);
  if (photo) {
    const image = el("img", { class: "photo", alt: "", loading: "lazy" });
    image.addEventListener("error", () => image.remove());
    image.src = photo;
    row.append(image);
  }
  if (text) row.append(el("div", { class: "bubble" }, text));

  const products = Array.isArray(reply.products) ? reply.products : [];
  if (products.length) {
    const cards = el("div", { class: "cards", role: "list" });
    products.forEach((p, i) => {
      const card = el("article", { class: "card", role: "listitem" });
      const img = safeUrl(p.image_url);
      if (img) {
        const image = el("img", { alt: "", loading: "lazy" });
        // a photo that no longer exists on the store's site becomes a plain grey square
        image.addEventListener("error", () => image.replaceWith(el("div", { class: "no-img", "aria-hidden": "true" })));
        image.src = img;
        card.append(image);
      }
      const body = el("div", { class: "body" });
      body.append(el("div", { class: "name" }, p.name || ""));
      const price = el("div", { class: "price" });
      price.append(el("bdi", {}, formatPrice(p)));
      if (p.original_price && p.price != null && !p.max_price) {
        const old = el("s", { "aria-label": `بدل ${p.original_price} شيكل` });
        old.append(el("bdi", {}, `${p.original_price} ₪`));
        price.append(" ", old);
      }
      body.append(price);
      if (p.reason) body.append(el("div", { class: "reason" }, p.reason));
      card.append(body);

      const actions = el("div", { class: "actions" });
      const add = el("button", { type: "button" }, "ضيفه عالسلة");
      const addText = products.length > 1 ? `ضيف ${ORDINALS[i] || p.name} عالسلة` : "ضيفه عالسلة";
      add.addEventListener("click", () => interactive && sendMessage(addText));
      if (!interactive) add.disabled = true;
      actions.append(add);
      const link = safeUrl(p.product_url);
      if (link) actions.append(Object.assign(el("a", { target: "_blank", rel: "noopener noreferrer" }, "شوف على الموقع"), { href: link }));
      card.append(actions);
      cards.append(card);
    });
    row.append(cards);
  }
  if (reply.cart && reply.cart.item_count) row.append(el("div", { class: "cart-note" }, `🛒 بالسلة ${reply.cart.item_count} قطعة · ${reply.cart.subtotal} ₪`));
  // Only for whoever is testing the page: the bot could not load or save its memory in Supabase.
  if (Array.isArray(reply.warnings) && reply.warnings.length) {
    const why = reply.warnings.includes("conversation_state_unavailable") ? "ما قدر يقرا المحادثة من Supabase" : "ما قدر يحفظ المحادثة في Supabase";
    row.append(el("div", { class: "error", role: "status" }, `⚠️ للتجربة فقط: البوت ${why}، فمش هيفتكر الرسالة دي. افتحي التنفيذ في n8n وشوفي node «Begin Turn» أو «Finish Turn».`));
  }
  els.thread.append(row);
  setQuickReplies(reply.quick_replies || [], interactive);
  scrollDown();
}

function setQuickReplies(list, interactive) {
  els.quick.replaceChildren();
  for (const label of list.slice(0, 4)) {
    const b = el("button", { type: "button" }, label);
    b.disabled = !interactive;
    b.addEventListener("click", () => sendMessage(label));
    els.quick.append(b);
  }
}

function addError(text) {
  els.thread.append(el("div", { class: "error", role: "alert" }, text));
  scrollDown();
}

// n8n may answer {output, text, products...} or [{...}]; older workflows send only Markdown in `output`.
function normaliseReply(data) {
  const r = Array.isArray(data) ? data[0] || {} : data || {};
  if (Array.isArray(r.products)) return r;
  return { text: String(r.output || r.text || "").replace(/!\[[^\]]*\]\([^)]*\)/g, "").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1"), products: [], quick_replies: [] };
}

async function sendMessage(text) {
  const message = String(text || "").trim().slice(0, 500);
  if (!message || busy) return;
  if (!chatUrl) { els.dialog.showModal(); return; }
  busy = true;
  els.send.disabled = true;
  els.quick.replaceChildren();
  addUser(message);
  showTyping();
  try {
    const res = await fetch(chatUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "sendMessage", sessionId, chatInput: message }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    hideTyping();
    addBot(normaliseReply(data));
  } catch (err) {
    hideTyping();
    addError("ما قدرنا نوصل للبوت. تأكد إن الـ workflow مفعّل وإن الرابط صح.");
    console.error(err);
  } finally {
    busy = false;
    els.send.disabled = false;
    els.input.focus();
  }
}

const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function playDemo() {
  const run = ++demoRun;
  els.thread.replaceChildren();
  els.quick.replaceChildren();
  for (const step of DEMO) {
    await wait(900);
    if (run !== demoRun) return;
    addUser(step.user);
    await wait(500);
    showTyping();
    await wait(1100);
    if (run !== demoRun) return;
    hideTyping();
    addBot(step, { interactive: false });
  }
}

function applyMode() {
  const live = Boolean(chatUrl);
  els.banner.hidden = live;
  els.input.disabled = !live;
  els.send.disabled = !live;
  els.input.placeholder = live ? "اكتب رسالة…" : "اربط n8n من الإعدادات عشان تكتب";
  document.getElementById("status").textContent = live ? "متصل بالبوت · بيرد فورًا" : "محادثة مسجّلة";
}

function restart() {
  demoRun++;
  sessionId = newSessionId();
  els.thread.replaceChildren();
  els.quick.replaceChildren();
  if (chatUrl) sendMessage("مرحبا");
  else playDemo();
}

els.form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = els.input.value;
  els.input.value = "";
  sendMessage(text);
});
els.play.addEventListener("click", playDemo);
document.getElementById("restart").addEventListener("click", restart);
document.getElementById("settings").addEventListener("click", () => {
  els.webhook.value = chatUrl;
  els.dialog.showModal();
});
document.getElementById("settings-form").addEventListener("submit", (e) => {
  if (e.submitter && e.submitter.value !== "save") return;
  const value = els.webhook.value.trim();
  if (value && !validChatUrl(value)) { e.preventDefault(); els.webhook.setCustomValidity("الرابط لازم يبدأ بـ https://"); els.webhook.reportValidity(); return; }
  els.webhook.setCustomValidity("");
  chatUrl = validChatUrl(value);
  store.set("yasmeen.chatUrl", chatUrl);
  applyMode();
  restart();
});
for (const b of document.querySelectorAll("[data-skin]")) {
  b.addEventListener("click", () => {
    document.body.classList.toggle("ig", b.dataset.skin === "ig");
    for (const other of document.querySelectorAll("[data-skin]")) other.setAttribute("aria-pressed", String(other === b));
    store.set("yasmeen.skin", b.dataset.skin);
  });
}
if (store.get("yasmeen.skin") === "ig") document.querySelector('[data-skin="ig"]').click();

applyMode();
restart();
</script>
</body>
</html>
