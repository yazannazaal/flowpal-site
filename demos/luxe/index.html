<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaelin Atelier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: dark gallery-like store. Glowing champagne arcs behind rounded glass panels; white pill CTAs; photography carries the luxury. */
:root{
  --ink:#100e0c;        /* page ground, warm black */
  --ink-2:#18150f;      /* raised surface */
  --ink-3:#221e18;      /* inputs, chips */
  --line:rgba(242,234,223,.13);
  --line-2:rgba(242,234,223,.22);
  --bone:#f3ece2;       /* text + white pills */
  --mute:#a99f93;       /* secondary text */
  --glow:#e6c7a1;       /* champagne light */
  --glow-rgb:230,199,161;
  --sale:#e59b86;
  --ok:#9fc7a2;
  --glass:linear-gradient(150deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 55%,rgba(var(--glow-rgb),.05));
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-accent:"Cormorant Garamond","Times New Roman",serif;
  --r-lg:26px;--r-md:18px;--r-sm:12px;
  --max:1280px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
html[lang="ar"]{--f-body:"Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif;--f-accent:"Aref Ruqaa","Amiri","Times New Roman",serif}
*{box-sizing:border-box}
html{background:var(--ink);scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--bone)}
img{display:block;max-width:100%}
h1,h2,h3,h4{margin:0;font-weight:400;line-height:1.1;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin-inline:auto;padding-left:var(--gut);padding-right:var(--gut-r)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}
.accent{font-family:var(--f-accent);font-style:italic;font-weight:400;color:var(--glow)}
html[lang="ar"] .accent{font-style:normal}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* demo ribbon */
.ribbon{font-size:12px;text-align:center;padding:7px 16px;background:linear-gradient(90deg,transparent,rgba(var(--glow-rgb),.14),transparent);color:var(--mute);border-bottom:1px solid var(--line)}
.ribbon b{color:var(--bone);font-weight:500}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.solid{background:rgba(16,14,12,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:inline-block;unicode-bidi:isolate;font-family:"Manrope",sans-serif;letter-spacing:.42em;font-size:19px;font-weight:500;white-space:nowrap;direction:ltr}
.logo sup{font-size:8px;letter-spacing:0;margin-inline-start:2px;color:var(--mute)}
.nav{display:flex;gap:30px;margin-inline:auto;font-size:14px}
.nav a{position:relative;padding:6px 0;color:var(--bone);opacity:.82}
.nav a:hover,.nav a.on{opacity:1}
.nav a.on::after{content:"";position:absolute;inset-inline:0;bottom:-2px;height:1px;background:var(--bone)}
.tools{display:flex;align-items:center;gap:6px}
.tbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:background .2s}
.tbtn:hover{background:rgba(255,255,255,.07)}
.badge{position:absolute;top:3px;inset-inline-end:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bone);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center;font-family:"Manrope",sans-serif}
.lang{font-size:12px;font-weight:600;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:99px;margin-inline-start:6px;font-family:"Manrope","Alexandria",sans-serif}
.lang:hover{border-color:var(--bone)}
.burger{display:none}
@media (max-width:960px){.nav{display:none}.burger{display:grid}.logo{margin-inline-end:auto}.hdr .wrap{gap:4px}.hide-sm{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 24px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;transition:transform .2s,background .2s,box-shadow .3s,border-color .2s}
.btn .ico{width:18px;height:18px}
.btn-light{background:var(--bone);color:#16130f;box-shadow:0 8px 30px -10px rgba(var(--glow-rgb),.55)}
.btn-light:hover{transform:translateY(-1px);box-shadow:0 12px 36px -8px rgba(var(--glow-rgb),.75)}
.btn-ghost{border:1px solid var(--line-2);color:var(--bone)}
.btn-ghost:hover{border-color:var(--bone);background:rgba(255,255,255,.04)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.circ{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);transition:background .2s,color .2s,border-color .2s}
.circ .ico{width:18px;height:18px}

/* light arcs */
.arcs{position:absolute;pointer-events:none;inset:0;overflow:hidden;z-index:0}
.arcs svg{position:absolute;overflow:visible}
.arc{fill:none;stroke-width:1.4}
@media (prefers-reduced-motion:no-preference){.arcs .breath{animation:breath 7s ease-in-out infinite}}
@keyframes breath{50%{opacity:.55}}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1.05fr;align-items:center;gap:24px;min-height:620px;padding-block:40px 0}
.eyebrow{font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--bone);opacity:.85;margin-bottom:22px}
html[lang="ar"] .eyebrow{letter-spacing:.04em;font-size:13px}
.hero h1{font-size:clamp(44px,6vw,80px);letter-spacing:-.02em;font-weight:400;line-height:1.02}
html[lang="ar"] .hero h1{letter-spacing:0;line-height:1.25;font-weight:500;font-size:clamp(38px,5vw,66px)}
.hero h1 .accent{display:block;font-size:1.04em;margin-top:6px;letter-spacing:-.01em}
html[lang="ar"] .hero h1 .accent{font-size:1.08em;margin-top:0}
.hero .lead{max-width:30em;margin-top:22px;font-size:17px;color:#ddd4c8;font-weight:300}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.play{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid currentColor}
.play svg{width:9px;height:9px;fill:currentColor}
.stage{position:relative;height:640px;align-self:end}
.fig{position:absolute;bottom:0;overflow:hidden;border-radius:999px 999px 0 0;-webkit-mask-image:linear-gradient(to bottom,#000 62%,transparent 98%);mask-image:linear-gradient(to bottom,#000 62%,transparent 98%)}
.fig img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) contrast(1.05) brightness(.92)}
.fig-a{inset-inline-start:2%;width:52%;height:96%;z-index:2;box-shadow:0 0 0 1px rgba(var(--glow-rgb),.25)}
.fig-b{inset-inline-end:0;width:46%;height:80%;z-index:1;bottom:6%;border-radius:999px 999px 40px 40px;box-shadow:0 0 0 1px rgba(var(--glow-rgb),.2)}
.halo{position:absolute;z-index:0;width:110%;aspect-ratio:1;inset-inline-start:-6%;top:-6%;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--glow-rgb),.20),transparent 70%)}
.tagchip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:99px;background:rgba(20,17,14,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line-2);font-size:12.5px;transition:border-color .2s}
html[dir="rtl"] .tagchip{padding:8px 8px 8px 14px}
.tagchip:hover{border-color:var(--glow)}
.tagchip img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.tagchip b{display:block;font-weight:500}
.tagchip span{color:var(--mute)}
.tc-1{inset-inline-start:-2%;bottom:24%}
.tc-2{inset-inline-end:2%;bottom:14%}
@media (max-width:960px){
  .hero .wrap{grid-template-columns:1fr;min-height:0;padding-top:28px}
  .stage{height:520px;margin-top:8px}
  .tc-1{inset-inline-start:0}
}
@media (max-width:520px){.stage{height:430px}.tagchip{font-size:11.5px}.tc-2{display:none}.hero .lead{font-size:15.5px}}

/* trust */
.trust{position:relative;z-index:2;border-block:1px solid var(--line);background:rgba(16,14,12,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.trust .it{display:flex;align-items:center;gap:14px;padding:22px 18px;justify-content:center}
.trust .it+.it{border-inline-start:1px solid var(--line)}
.trust .ico{width:30px;height:30px;stroke-width:1.2;color:var(--glow)}
.trust b{display:block;font-size:17px;font-weight:500}
.trust small{display:block;font-size:12px;color:var(--mute)}
@media (max-width:860px){.trust .wrap{grid-template-columns:1fr 1fr}.trust .it{justify-content:flex-start}.trust .it:nth-child(3){border-inline-start:0}.trust .it:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:420px){.trust .it{padding:16px 6px;gap:10px}.trust b{font-size:15px}}

/* sections */
.sec{position:relative;padding-block:72px}
.sec-sm{padding-block:44px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.01em}
.sec-h p{color:var(--mute);margin-top:8px;max-width:34em}
.link{display:inline-flex;align-items:center;gap:8px;font-size:14px;border-bottom:1px solid var(--line-2);padding-bottom:3px}
.link:hover{border-color:var(--bone)}
.link .ico{width:16px;height:16px}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cat{position:relative;display:flex;height:210px;border-radius:var(--r-md);overflow:hidden;background:var(--glass);border:1px solid var(--line);transition:border-color .3s}
.cat:hover{border-color:rgba(var(--glow-rgb),.45)}
.cat .txt{position:relative;z-index:2;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.cat h3{font-family:var(--f-accent);font-style:normal;font-size:30px;line-height:1.05;color:var(--bone)}
html[lang="ar"] .cat h3{font-family:var(--f-body);font-size:24px;font-weight:500;line-height:1.3}
.cat .ph{position:absolute;inset-block:0;inset-inline-end:0;width:62%;-webkit-mask-image:linear-gradient(to var(--fade-dir),transparent,#000 40%);mask-image:linear-gradient(to var(--fade-dir),transparent,#000 40%)}
html{--fade-dir:right}html[dir="rtl"]{--fade-dir:left}
.cat .ph img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.9);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.cat:hover .ph img{transform:scale(1.05)}
.cat:hover .circ{background:var(--bone);color:var(--ink);border-color:var(--bone)}
@media (max-width:860px){.cats{grid-template-columns:1fr}.cat{height:170px}}

/* product grid + card */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 54px)/4);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
@media (max-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.rail{grid-auto-columns:calc((100% - 36px)/3)}}
@media (max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.rail{grid-auto-columns:62%}}
.card{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .pimg{position:relative;aspect-ratio:3/4;border-radius:var(--r-md);overflow:hidden;background:var(--ink-2);border:1px solid var(--line)}
.card .pimg img{width:100%;height:100%;object-fit:cover;filter:saturate(.84) brightness(.95);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.card:hover .pimg img{transform:scale(1.045)}
.card .pill{position:absolute;top:12px;inset-inline-start:12px;font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(16,14,12,.7);backdrop-filter:blur(8px);border:1px solid var(--line-2)}
.card .pill.s{color:var(--sale);border-color:rgba(229,155,134,.4)}
.heart{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(16,14,12,.55);backdrop-filter:blur(8px);border:1px solid var(--line);transition:color .2s}
.heart .ico{width:17px;height:17px}
.heart.on .ico{fill:var(--glow);stroke:var(--glow)}
.qadd{position:absolute;inset-inline:12px;bottom:12px;height:42px;border-radius:99px;background:rgba(243,236,226,.94);color:#16130f;font-size:13px;font-weight:500;opacity:0;transform:translateY(8px);transition:.3s}
.card:hover .qadd,.card:focus-within .qadd{opacity:1;transform:none}
@media (hover:none){.qadd{display:none}}
.card .meta{display:flex;justify-content:space-between;gap:10px;align-items:start}
.card h3{font-size:14.5px;font-weight:400;line-height:1.4}
.card .sub{font-size:12.5px;color:var(--mute)}
.price{font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.price del{color:var(--mute);font-size:.88em;margin-inline-end:6px}
.price .now{color:var(--sale)}
.sw{display:flex;gap:5px}
.sw i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line-2)}

/* new season banner */
.banner{position:relative;isolation:isolate;display:grid;grid-template-columns:.9fr 1.1fr;min-height:400px;border-radius:var(--r-lg);overflow:hidden;background:var(--glass),var(--ink-2);border:1px solid var(--line)}
.banner .txt{position:relative;z-index:2;padding:56px 50px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.banner h2{font-size:clamp(32px,4vw,50px);letter-spacing:-.01em}
.banner p{color:#d6ccc0;max-width:22em}
.banner .btn{align-self:flex-start;margin-top:12px}
.banner .ph{position:relative}
.banner .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.7) brightness(.88) sepia(.12);-webkit-mask-image:linear-gradient(to var(--fade-dir),transparent,#000 30%);mask-image:linear-gradient(to var(--fade-dir),transparent,#000 30%)}
@media (max-width:860px){.banner{grid-template-columns:1fr}.banner .ph{height:260px;order:-1}.banner .ph img{-webkit-mask-image:linear-gradient(to top,transparent,#000 35%);mask-image:linear-gradient(to top,transparent,#000 35%)}.banner .txt{padding:8px 24px 36px}}

/* looks */
.looks{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:18px}
.look{position:relative;border-radius:var(--r-md);overflow:hidden;min-height:440px;border:1px solid var(--line)}
.look img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.78) brightness(.86);transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.look:hover img{transform:scale(1.04)}
.look::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,6,.85),transparent 55%)}
.look .cap{position:absolute;z-index:2;inset-inline:22px;bottom:22px;display:flex;justify-content:space-between;align-items:end;gap:12px}
.look h3{font-size:22px}
.look small{color:var(--mute);display:block;margin-top:4px}
@media (max-width:860px){.looks{grid-template-columns:1fr 1fr}.look:first-child{grid-column:1/-1}.look{min-height:320px}}
@media (max-width:520px){.looks{grid-template-columns:1fr}.look{min-height:300px}}

/* values */
.values{border-block:1px solid var(--line)}
.values .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.val{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:38px 16px}
.val+.val{border-inline-start:1px solid var(--line)}
.val .ico{width:34px;height:34px;stroke-width:1.1;color:var(--glow)}
.val b{font-weight:500;font-size:15px}
.val p{font-size:13px;color:var(--mute);max-width:20em}
@media (max-width:860px){.values .wrap{grid-template-columns:1fr 1fr}.val:nth-child(3){border-inline-start:0}.val:nth-child(n+3){border-top:1px solid var(--line)}}

/* newsletter + footer */
.news{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding:44px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--line);position:relative;overflow:hidden}
.news h2{font-size:clamp(26px,3vw,36px)}
.news p{color:var(--mute);margin-top:8px}
.field{display:flex;gap:8px;padding:6px;border-radius:99px;border:1px solid var(--line-2);background:rgba(0,0,0,.25)}
.field input{flex:1;min-width:0;background:none;border:0;padding:0 16px;outline:none}
@media (max-width:860px){.news{grid-template-columns:1fr;padding:28px 22px}.field .btn{padding:0 16px}}
.ftr{border-top:1px solid var(--line);margin-top:72px;padding-block:56px 30px;position:relative;overflow:hidden}
.ftr .cols{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px}
.ftr h4{font-size:13px;color:var(--mute);margin-bottom:14px;font-weight:500}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px}
.ftr ul a{opacity:.85}.ftr ul a:hover{opacity:1}
.ftr .about{color:var(--mute);font-size:14px;max-width:26em;margin-top:16px}
.ftr .base{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.pay{display:flex;gap:6px}
.pay span{border:1px solid var(--line-2);border-radius:6px;padding:2px 8px;font-size:11px;font-family:"Manrope",sans-serif}
@media (max-width:860px){.ftr .cols{grid-template-columns:1fr 1fr}.ftr .cols>:first-child{grid-column:1/-1}}

/* page header (inner pages) */
.phd{position:relative;overflow:hidden;padding-block:46px 30px;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:14px;flex-wrap:wrap}
.crumbs a:hover{color:var(--bone)}
.phd h1{font-size:clamp(34px,4.5vw,56px);letter-spacing:-.015em;position:relative}
.phd p{color:var(--mute);margin-top:10px;max-width:40em;position:relative}

/* shop filters */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:20px;position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;background:rgba(16,14,12,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);font-size:13px;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--bone)}
.chip.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.sel{height:36px;border-radius:99px;border:1px solid var(--line-2);background:var(--ink-3);padding:0 14px;font-size:13px}
.fbtn{display:inline-flex;align-items:center;gap:8px}
.fbtn .ico{width:16px;height:16px}
.fpanel{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:22px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--ink-2);margin-bottom:24px}
.fpanel h4{font-size:13px;color:var(--mute);margin-bottom:12px;font-weight:500}
.fpanel .opts{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:44px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);font-size:13px;font-family:"Manrope",sans-serif}

@media (max-width:900px){.pdp{grid-template-columns:1fr;gap:28px;padding-top:18px}.gal{position:static;grid-template-columns:1fr}.thumbs{grid-auto-flow:column;grid-auto-columns:64px;order:2}}

.mini span{min-width:20px;text-align:center;font-size:13px;font-family:"Manrope",sans-serif}
.rm{font-size:12px;color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.tot{display:flex;justify-content:space-between;font-size:15px}

.search{position:fixed;z-index:80;inset-inline:0;top:0;background:var(--ink-2);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);transform:translateY(-102%);transition:transform .38s cubic-bezier(.2,.7,.2,1);max-height:90vh;overflow:auto}

/* lookbook film */

@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.film .bars{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));inset-inline:var(--gut);display:flex;gap:6px;z-index:3}

.film .nav-l{inset-inline-start:0}.film .nav-r{inset-inline-end:0}

/* checkout */
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-bottom:26px;flex-wrap:wrap}

.vfig{width:100%;height:auto;max-height:600px;display:block;overflow:visible}
.vfig g.pop{animation:vpop .5s cubic-bezier(.2,.7,.2,1)}
@keyframes vpop{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.vfig g.pop{animation:none}}
.vfig .bands{mix-blend-mode:normal}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.toggle i{width:38px;height:22px;border-radius:99px;background:var(--ink-3);border:1px solid var(--line-2);position:relative;transition:.2s}
.toggle i::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:.2s}
.toggle[aria-pressed="true"]{color:var(--bone)}
.toggle[aria-pressed="true"] i{background:rgba(var(--glow-rgb),.25);border-color:var(--glow)}
.toggle[aria-pressed="true"] i::after{inset-inline-start:18px;background:var(--glow)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.ostrip{position:relative;z-index:2;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:14px;align-items:center}
.ostrip h4{font-size:13px;font-weight:500;color:var(--mute);white-space:nowrap}
.outer-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;min-width:0}
.outer-strip::-webkit-scrollbar{display:none}
.outer-strip .th{width:56px}
.vnote{position:relative;z-index:2;font-size:11.5px;color:var(--mute);margin-top:10px;text-align:center}
.fitpanel{position:sticky;top:96px}
.fitpanel h2{margin-bottom:6px}
.vline{grid-template-columns:64px 1fr auto}
.vline img{width:64px}
.vctl{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.sel.sm{height:30px;padding:0 10px;font-size:12px}
.fitchip{display:inline-block;margin-top:8px;font-size:11.5px;padding:2px 10px;border-radius:99px;border:1px solid var(--c);color:var(--c)}
.saved{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.saved h4{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:10px}
.looksaved{display:flex;gap:8px;flex-wrap:wrap}
.lk{width:58px;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--ink-3);overflow:hidden;padding:4px 0}
.lk:hover{border-color:var(--glow)}
.vfig.mini{height:100%;width:auto}
.vteaser{grid-template-columns:1fr 1fr}
.vt-fig{position:relative;z-index:2;display:flex;justify-content:center;align-items:end;gap:0;padding:24px 20px 0;background:radial-gradient(ellipse 60% 55% at 50% 60%,rgba(var(--glow-rgb),.12),transparent 70%)}
.vt-fig .vfig{width:auto;height:380px;max-width:50%}
@media (max-width:1000px){.fitw{grid-template-columns:1fr}.fitpanel{position:static}}
@media (max-width:860px){.vteaser .vt-fig{order:-1;padding-top:16px}.vt-fig .vfig{height:300px}}
@media (max-width:560px){.s-main{grid-template-columns:62px minmax(0,1fr) 62px;gap:4px}.th{width:58px}.studio{padding:12px}.rackc .circ{width:34px;height:34px}.s-top .btn{margin-inline-start:0}.ostrip{flex-direction:column;align-items:stretch;gap:6px}.vfig{max-height:470px}}

function shopView(scope){
  const cfg = {
    men:{title:tx(["رجالي","Men"]), list:P.filter(p=>p.c==="men"), types:TYPES.men},
    women:{title:tx(["نسائي","Women"]), list:P.filter(p=>p.c==="women"), types:TYPES.women},
    accessories:{title:tx(["الإكسسوارات","Accessories"]), list:P.filter(p=>p.c==="accessories"), types:TYPES.accessories},
    sale:{title:tx(["تخفيضات","Sale"]), sub:tx(["خصومات حتى 30% على قطع مختارة.","Up to 30% off selected pieces."]), list:P.filter(p=>p.was)},
    new:{title:tx(["وصل حديثًا","New In"]), sub:t("arrivalsSub"), list:P.filter(p=>p.tag==="new")}
  }[scope];
  const s = shopState;
  let list = cfg.list.filter(p =>
    (s.type==="all" || p.t===s.type) &&
    (!s.sizes.length || p.s.some(z=>s.sizes.includes(z) && !(p.out||[]).includes(z))) &&
    (!s.colors.length || p.col.some(c=>s.colors.includes(c))) &&
    (!s.price || (()=>{const [a,b]=s.price.split("-").map(Number); return p.p>=a && p.p<b})())
  );
  if(s.sort==="low") list.sort((a,b)=>a.p-b.p);
  if(s.sort==="high") list.sort((a,b)=>b.p-a.p);
  if(s.sort==="new") list.sort((a,b)=>(b.tag==="new")-(a.tag==="new"));
  const allSizes = [...new Set(cfg.list.flatMap(p=>p.s))];
  const allColors = [...new Set(cfg.list.flatMap(p=>p.col))];
  const nFilters = s.sizes.length + s.colors.length + (s.price?1:0);
  return `${pageHead(cfg.title, cfg.sub || tx(DESC[scope]||["",""]), cfg.title)}
  <div class="wrap">
    <div class="tbar">
      ${cfg.types?`<div class="chips" role="group">${[["all",t("all"),t("all")],...cfg.types].map(x=>`<button class="chip ${s.type===x[0]?"on":""}" data-type="${x[0]}">${L==="ar"?x[1]:x[2]}</button>`).join("")}</div>`:`<div class="chips"></div>`}
      <button class="chip fbtn ${s.open||nFilters?"on":""}" data-act="toggleFilters" aria-expanded="${s.open}">${ico("filter")} ${t("filters")}${nFilters?` (${nFilters})`:""}</button>
      <label class="sr" for="sortSel">Sort</label>
      <select class="sel" id="sortSel" data-act="sort">${t("sort").map(o=>`<option value="${o[0]}" ${s.sort===o[0]?"selected":""}>${L==="ar"?o[1]:o[2]}</option>`).join("")}</select>
    </div>
    ${s.open?`<div class="fpanel">
      <div><h4>${t("size")}</h4><div class="opts">${allSizes.map(z=>`<button class="sz ${s.sizes.includes(z)?"on":""}" data-fsize="${z}">${sizeLabel(z)}</button>`).join("")}</div></div>
      <div><h4>${t("color")}</h4><div class="opts">${allColors.map(c=>`<button class="cdot ${s.colors.includes(c)?"on":""}" style="background:${COLORS[c][0]}" data-fcolor="${c}" title="${colorName(c)}" aria-label="${colorName(c)}" aria-pressed="${s.colors.includes(c)}"></button>`).join("")}</div></div>
      <div><h4>${t("priceT")}</h4><div class="opts">${t("priceRanges").map(r=>`<button class="chip ${s.price===r[0]?"on":""}" data-fprice="${r[0]}">${L==="ar"?r[1]:r[2]}</button>`).join("")}</div>
      ${nFilters?`<button class="link" style="margin-top:18px" data-act="clearFilters">${t("clear")}</button>`:""}</div>
    </div>`:""}
    <div style="display:flex;margin:4px 0 18px"><span class="count num">${list.length} ${t("items")}</span></div>
    ${list.length?`<div class="grid">${list.map(cardHTML).join("")}</div>`:`<div class="empty"><b>${t("noResults")}</b><p>${t("noResultsP")}</p><button class="btn btn-ghost" data-act="clearFilters">${t("clear")}</button></div>`}
  </div>`;
}

}

/* =========================================================
   VIRTUAL FIT: parametric illustrated model + garments (SVG).
   Body proportions come from gender + model size; every garment
   is drawn from the same landmarks, so all pieces fit all sizes.
   ========================================================= */
const FITMAP = {m1:["outer","blazer"],m2:["top","shawl"],m3:["outer","blazer"],m4:["outer","trucker"],m5:["outer","blazer"],m6:["outer","biker"],m7:["outer","bomber"],m8:["top","shirt"],m9:["outer","trucker"],m10:["top","tee"],m11:["bottom","jeans"],m12:["top","sweat"],m13:["bottom","chinos"],
  w1:["outer","coat"],w2:["outer","blazer"],w3:["outer","trench"],w4:["outer","longcoat"],w5:["outer","coat"],w6:["dress","midi"],w7:["dress","gown"],w8:["dress","romper"],w9:["dress","set"],w10:["top","blouse"],w11:["top","stripe"],w12:["top","oversize"],w13:["bottom","jogger"],w14:["bottom","skinny"]};
P.forEach(p => { if(FITMAP[p.id]) p.f = {k:FITMAP[p.id][0], sh:FITMAP[p.id][1]} });
const SKINS = [["#ecc9ab","Light"],["#c99674","Medium"],["#8a5a3d","Deep"]];
const CX = 150;
let fit = store.get("fit", null) || {
  g:"w", view:false, sug:{top:0,bottom:0}, saved:[],
  m:{size:1, skin:1, top:"m10", bottom:"m11", outer:null},
  w:{size:1, skin:0, top:"w12", bottom:"w14", outer:"w1"},
  opts:{m10:{color:"white"}, m11:{color:"lightdenim"}, w12:{color:"white"}}
};
let vPop = "";
const saveFit = () => store.set("fit", fit);

const fx = n => n.toFixed(1);
const f2 = p => fx(p[0])+","+fx(p[1]);
const Mv = p => "M"+f2(p), Lv = p => " L"+f2(p);
const lerp = (a,b,t) => a+(b-a)*t;
function interp(st, y){ if(y<=st[0][0]) return st[0][1]; for(let i=1;i<st.length;i++){ if(y<=st[i][0]){ const a=st[i-1], b=st[i]; return lerp(a[1],b[1],(y-a[0])/(b[0]-a[0])) } } return st[st.length-1][1] }
function cr(pts){ let d=""; for(let i=0;i<pts.length-1;i++){ const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
  d += ` C${f2([p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6])} ${f2([p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6])} ${f2(p2)}` } return d }
function lum(hex){ const h=hex.replace("#",""); const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255); return .2126*r+.7152*g+.0722*b }
const det = c => lum(c) > .45 ? "rgba(0,0,0,.24)" : "rgba(255,255,255,.17)";
const pc = (d, fill, ex="") => `<path d="${d}" fill="${fill}" ${ex}/><path d="${d}" fill="url(#vShade)" ${ex.includes("opacity")?ex:""}/>`;
const dl = (d, c, w=1.2, ex="") => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const dot = (x,y,r,c) => `<circle cx="${fx(x)}" cy="${fx(y)}" r="${r}" fill="${c}"/>`;
const mir = (fn) => [-1,1].map(fn).join("");

const WF = 1.36; /* width factor: figure proportions (about 9 heads tall, fashion croquis) */
function Bd(g, si){ const k=[0.93,1,1.07,1.14][si], m=g==="m";
  return {g, k, sh:(m?59:49)*(0.65+0.35*k)*WF, ch:(m?50:43)*k*WF, wa:(m?42:31)*k*WF, hp:(m?45:51)*k*WF, nk:(m?12:10)*WF, hx:m?29:27, hy:m?36:35, waY:m?262:246, aw:(m?1:0.84)*WF} }
function torsoSt(B,e,fl=0.1){ return [[122,B.nk+3+e*0.3],[128,B.sh-12+e],[138,B.sh-3+e],[152,B.sh+e],[178,B.ch+3+e],[200,B.ch+e],[B.waY,B.wa+e],[322,B.hp+e],[352,B.hp+1+e],[700,B.hp+1+e+(700-352)*fl]] }
function sidePts(st,s,y0,y1){ const ys=[y0,...st.map(p=>p[0]).filter(y=>y>y0&&y<y1),y1]; return ys.map(y=>[CX+s*interp(st,y),y]) }
function torsoPath(B,o){ const y0=o.y0||128, ny=o.ny||122, st=torsoSt(B,o.e,o.fl??0.1);
  const Lp=sidePts(st,-1,y0,o.hem), Rp=sidePts(st,1,y0,o.hem).reverse(), nw=o.neck.w;
  let d = Mv([CX-nw,ny])+Lv(Lp[0])+cr(Lp)+" Q"+f2([CX,o.hem+(o.hemC??6)])+" "+f2(Rp[0])+cr(Rp)+Lv([CX+nw,ny]);
  return d + (o.neck.v ? Lv([CX,o.neck.v])+" Z" : " Q"+f2([CX,ny+2*o.neck.d])+" "+f2([CX-nw,ny])+" Z") }
function armSt(B){ const a=B.aw; return [[134,B.sh-12,12*a],[165,B.sh-4,13*a],[210,B.sh+3,11.5*a],[260,B.sh+8,10*a],[320,B.sh+13,8.5*a],[374,B.sh+17,6.5*a]] }
function armAt(B,y){ const st=armSt(B); return [interp(st.map(p=>[p[0],p[1]]),y), interp(st.map(p=>[p[0],p[2]]),y)] }
function armPath(B,s,e,y1,cuff=0){ const st=armSt(B), y0=st[0][0];
  const ys=[y0,...st.map(p=>p[0]).filter(y=>y>y0&&y<y1),y1];
  const out=ys.map((y,i)=>{ const [c,w]=armAt(B,y); return [CX+s*(c+w+e+(i===ys.length-1?cuff:0)),y] });
  const inn=ys.map((y,i)=>{ const [c,w]=armAt(B,y); return [CX+s*(c-w-e-(i===ys.length-1?cuff*0.5:0)),y] }).reverse();
  const [c0,w0]=armAt(B,y0); return Mv(inn[inn.length-1])+" Q"+f2([CX+s*(c0+w0*0.35),y0-10-e*0.4])+" "+f2(out[0])+cr(out)+Lv(inn[0])+cr(inn)+" Z" }
function legSt(B){ const w=WF; return [[300,B.hp*0.5,B.hp*0.5+4],[400,25*B.k*w,22*B.k*w],[500,21*w,13.5*B.k*w],[575,20*w,14*B.k*w],[640,19*w,7.5*w]] }
function legPath(B,s,e,y1,fl=0,top=300){ const st=legSt(B);
  const C=y=>interp(st.map(p=>[p[0],p[1]]),y), W=y=>Math.max(5, interp(st.map(p=>[p[0],p[2]]),y)+e+(y>400?fl*(y-400)/240:0));
  const ys=[top,...st.map(p=>p[0]).filter(y=>y>top&&y<y1),y1];
  const out=ys.map(y=>[CX+s*(C(y)+W(y)),y]), inn=ys.map(y=>[CX+s*Math.max(C(y)-W(y), y<360?-2:1),y]).reverse();
  return Mv(inn[inn.length-1])+Lv(out[0])+cr(out)+Lv(inn[0])+cr(inn)+" Z" }
function legAt(B,y,e=0){ const st=legSt(B); return [interp(st.map(p=>[p[0],p[1]]),y), interp(st.map(p=>[p[0],p[2]]),y)+e] }
function pelvisPath(B,e,top){ const st=torsoSt(B,e,0), L=sidePts(st,-1,top,338), R=sidePts(st,1,top,338).reverse();
  return Mv(L[0])+cr(L)+" Q"+f2([CX,386])+" "+f2(R[0])+cr(R)+" Z" }
const bandAcross = (B,y,e,c,w=1.2) => { const d=interp(torsoSt(B,e),y); return dl(`M${fx(CX-d)},${y} Q${CX},${y+6} ${fx(CX+d)},${y}`,c,w) };

/* ---- body ---- */
function bodySVG(B, skin){
  const sk = skin, g = B.g;
  let s = mir(si=>pc(legPath(B,si,0,646,0,300), sk));
  s += pc(pelvisPath(B,0,300), sk);
  s += mir(si=>pc(armPath(B,si,0,380), sk));
  s += pc(torsoPath(B,{e:0,hem:358,neck:{w:B.nk,d:0},fl:0,hemC:8}), sk);
  s += pc(`M${CX-B.nk*0.72},86 L${CX+B.nk*0.72},86 L${CX+B.nk+1},124 Q${CX},130 ${CX-B.nk-1},124 Z`, sk);
  const hy=B.hy, hx=B.hx, cy=60;
  s += `<ellipse cx="${CX}" cy="${cy}" rx="${hx}" ry="${hy}" fill="${sk}"/><ellipse cx="${CX}" cy="${cy}" rx="${hx}" ry="${hy}" fill="url(#vShade)"/>`;
  s += mir(si=>`<ellipse cx="${CX+si*(hx+1)}" cy="${cy+4}" rx="4" ry="8" fill="${sk}"/>`);
  const hair = g==="m" ? "#2a211c" : "#3a2a20";
  if(g==="m") s += `<path d="M${CX-hx-1},${cy+2} C${CX-hx-3},${cy-hy-10} ${CX+hx+3},${cy-hy-10} ${CX+hx+1},${cy+2} C${CX+hx-2},${cy-hy*0.45} ${CX+hx-8},${cy-hy*0.62} ${CX},${cy-hy*0.6} C${CX-hx+8},${cy-hy*0.62} ${CX-hx+2},${cy-hy*0.45} ${CX-hx-1},${cy+2}Z" fill="${hair}"/>`;
  else s += `<circle cx="${CX}" cy="${cy-hy-4}" r="15" fill="${hair}"/><path d="M${CX-hx-2},${cy+10} C${CX-hx-5},${cy-hy-10} ${CX+hx+5},${cy-hy-10} ${CX+hx+2},${cy+10} C${CX+hx-2},${cy-hy*0.4} ${CX+hx-10},${cy-hy*0.66} ${CX},${cy-hy*0.62} C${CX-hx+10},${cy-hy*0.66} ${CX-hx+2},${cy-hy*0.4} ${CX-hx-2},${cy+10}Z" fill="${hair}"/>`;
  return s;
}
function handsSVG(B, sk){ return mir(si=>{ const [c]=armAt(B,374); return `<ellipse cx="${fx(CX+si*c)}" cy="394" rx="${6.4*B.aw}" ry="19" fill="${sk}" transform="rotate(${si*-4} ${fx(CX+si*c)} 394)"/>` }) }
function shoesSVG(B, sk, dress){
  if(dress === "gown") return "";
  return mir(si=>{ const x=CX+si*26;
    if(B.g==="m") return `<path d="M${x-10},630 L${x+10},630 Q${x+17},650 ${x+16},664 Q${x},672 ${x-16},664 Q${x-17},650 ${x-10},630Z" fill="#efebe4"/>${dl(`M${x-16.5},662 Q${x},669 ${x+16.5},662`,"#bdb6ab",3.4)}${dl(`M${x-4},640 L${x+4},640 M${x-5},646 L${x+5},646`,"#b9b2a6",1)}`;
    return `<path d="M${x-8},626 L${x+8},626 Q${x+11},648 ${x+9},664 Q${x},671 ${x-9},664 Q${x-11},648 ${x-8},626Z" fill="${sk}"/><path d="M${x-10.5},647 Q${x},641 ${x+10.5},647 Q${x+10.5},661 ${x+8},668 Q${x},675 ${x-8},668 Q${x-10.5},661 ${x-10.5},647Z" fill="#17130f"/>`; });
}

/* ---- garments ---- */
function sleeves(B,e,y1,c,cuff=1,ex=""){ return mir(si=>pc(armPath(B,si,e,y1,cuff),c,ex)) }
function cuffLines(B,y,e,c){ return mir(si=>{ const [ac,w]=armAt(B,y); return dl(`M${fx(CX+si*(ac-w-e))},${y} L${fx(CX+si*(ac+w+e))},${y+1}`,c,1.2) }) }
function trousers(B,c,o){
  const E=o.e, top=o.top, hem=o.hem||646, k=det(c);
  let s = mir(si=>pc(legPath(B,si,E,hem,o.fl||0,300),c)) + pc(pelvisPath(B,E,top),c);
  s += bandAcross(B,top+10,E,k);
  if(o.fly) s += dl(`M${CX+3},${top+10} L${CX+3},${top+50} Q${CX+3},${top+60} ${CX-6},${top+64}`,k);
  if(o.stitch) s += mir(si=>dl(`M${fx(CX+si*(B.wa+E-4))},${top+12} Q${fx(CX+si*(B.wa*0.55))},${top+20} ${fx(CX+si*(B.wa*0.45))},${top+36}`,o.stitch,1.1,'stroke-dasharray="2 2"'));
  if(o.crease) s += mir(si=>{ const [lc]=legAt(B,420); return dl(`M${fx(CX+si*legAt(B,360)[0])},360 L${fx(CX+si*lc)},${hem-6}`,k,1) });
  if(o.cuff) s += mir(si=>{ const [lc,w]=legAt(B,hem-8,E+(o.fl||0)); return pc(`M${fx(CX+si*(lc-w))},${hem-14} L${fx(CX+si*(lc+w))},${hem-14} L${fx(CX+si*(lc+w-1))},${hem} L${fx(CX+si*(lc-w+1))},${hem} Z`,c)+dl(`M${fx(CX+si*(lc-w))},${hem-14} L${fx(CX+si*(lc+w))},${hem-14}`,k) });
  if(o.string) s += dl(`M${CX-4},${top+10} q-3,18 -6,30 M${CX+4},${top+10} q3,18 6,30`,k,1.4);
  return s;
}
function shirt(B,c,o){ const E=o.e, k=det(c), fill=o.fill||c;
  let s = sleeves(B,E+3,o.sleeve||366,fill,2) + pc(torsoPath(B,{e:E,hem:o.hem,neck:{w:B.nk+3,d:5},fl:0.05,hemC:10}),fill);
  s += mir(si=>pc(`M${CX+si*(B.nk+4)},117 L${CX+si*1},136 L${CX+si*(B.nk+13)},142 Z`,fill)+dl(`M${CX+si*(B.nk+4)},117 L${CX+si*1},136 L${CX+si*(B.nk+13)},142 Z`,k,1));
  s += dl(`M${CX},136 L${CX},${o.hem+6}`,k,1);
  for(let y=160;y<o.hem;y+=34) s += dot(CX,y,1.7,k);
  if((o.sleeve||366) > 300) s += cuffLines(B,(o.sleeve||366)-12,E+4,k);
  return s;
}
function lapels(B,c,vY,wide){ const k=det(c);
  return mir(si=>{ const d=`M${CX+si*(B.nk+3)},120 L${fx(CX+si*(wide?B.ch*0.86:B.ch*0.62))},${wide?168:174} L${fx(CX+si*(wide?B.ch*0.66:B.ch*0.5))},${wide?188:184} L${CX+si*3},${vY} Z`;
    return `<path d="${d}" fill="${c}"/><path d="${d}" fill="#fff" fill-opacity=".06"/>`+dl(d,k,1) });
}
function garmentSVG(p, B, bottomOpen){
  const o = vOpt(p.id), c = COLORS[o.color][0], k = det(c), diff = vDiff(p.id), ease = diff*5, sh = p.f.sh;
  let s = "";
  const tight = (y1,y2) => diff < 0 ? dl(`M${fx(CX-B.ch+8)},${y1} Q${CX},${y1+9} ${fx(CX+B.ch-8)},${y1} M${fx(CX-B.ch+12)},${y2} Q${CX},${y2+8} ${fx(CX+B.ch-12)},${y2}`,k,1.1) : "";
  const E0 = v => Math.max(0.5, v + ease);
  switch(sh){
    case "tee": { const E=E0(4); s = sleeves(B,E+3,206,c,2) + pc(torsoPath(B,{e:E,hem:330,neck:{w:B.nk+5,d:9},fl:0.06}),c) + dl(`M${CX-B.nk-5},122 Q${CX},140 ${CX+B.nk+5},122`,k,2.4) + dl(`M${CX-28},236 q10,6 18,2`,k,1) + tight(200,240); break }
    case "sweat": case "shawl": { const E=E0(7);
      s = sleeves(B,E+4,366,c,1) + pc(torsoPath(B,{e:E,hem:328,neck: sh==="shawl"?{w:B.nk+4,v:190}:{w:B.nk+4,d:8},fl:0.04}),c);
      s += bandAcross(B,314,E,k) + cuffLines(B,352,E+5,k);
      if(sh==="shawl") s += dl(`M${CX-B.nk-5},120 L${CX},192 L${CX+B.nk+5},120`,c,10) + dl(`M${CX-B.nk-10},121 L${CX-2},196 M${CX+B.nk+10},121 L${CX+2},196`,k,1) + mir(si=>dl(`M${CX+si*24},210 L${CX+si*26},300 M${CX+si*36},210 L${CX+si*38},300`,k,.8));
      else s += dl(`M${CX-B.nk-4},122 Q${CX},138 ${CX+B.nk+4},122`,k,2.6);
      s += tight(206,246); break }
    case "shirt": case "oversize": case "stripe": {
      const big = sh==="oversize"; let fill = c, pat = "";
      if(sh==="stripe"){ const fg = o.color==="white" ? COLORS.navy[0] : "#f3efe8", bg = c; pat = `<pattern id="vStripe" width="8" height="10" patternUnits="userSpaceOnUse"><rect width="8" height="10" fill="${bg}"/><rect width="2.4" height="10" fill="${fg}"/></pattern>`; fill = "url(#vStripe)" }
      s = pat + shirt(B,c,{e:E0(big?13:5),hem:big?372:338,fill}) + tight(206,244); break }
    case "blouse": { const E=E0(8); s = sleeves(B,E+8,364,c,4,'fill-opacity=".8"') + pc(torsoPath(B,{e:E,hem:330,neck:{w:B.nk+4,d:7},fl:0.05}),c,'fill-opacity=".8"') + dl(`M${CX-B.nk-4},122 Q${CX},136 ${CX+B.nk+4},122`,k,2) + dl(`M${CX},136 l-8,12 M${CX},136 l8,12`,c,3) + cuffLines(B,352,E+11,k); break }
    case "blazer": { const E=E0(9);
      s = sleeves(B,E+3,362,c,1) + pc(torsoPath(B,{e:E,hem:374,neck:{w:B.nk+3,v:246},fl:0.04,hemC:4}),c) + lapels(B,c,244,false);
      s += dl(`M${CX-2},246 L${CX-2},368`,k,1) + dot(CX-2,268,2.6,k) + dot(CX-2,300,2.6,k) + mir(si=>dl(`M${fx(CX+si*(B.hp+E-10))},336 L${CX+si*16},336`,k,1.2)) + dl(`M${fx(CX-B.ch+6)},206 L${CX-B.ch+26},206`,k,1) + cuffLines(B,350,E+4,k); break }
    case "coat": case "trench": case "longcoat": {
      const E=E0(12), hem = sh==="longcoat"?566:sh==="trench"?528:548, closed = sh==="longcoat";
      s = sleeves(B,E+4,366,c,2) + pc(torsoPath(B,{e:E,hem,neck: closed?{w:B.nk+5,d:5}:{w:B.nk+3,v:sh==="trench"?236:262},fl:0.14,hemC:6}),c);

let curRoute = "";
function route(){
  const h = (location.hash || "#home").slice(1) || "home";
  let html, key = h;
  const shops = ["men","women","accessories","sale","new"];
  if(h !== curRoute){ if(shops.includes(h)) shopState = {type:"all", sizes:[], colors:[], price:"", sort:"feat", open:false}; if(h==="checkout") coState.step = 0; }
  if(shops.includes(h)) html = shopView(h);
  else if(h.startsWith("p-")) { html = V.product(h.slice(2)); key = "product"; }
  else if(V[h] && h!=="product" && h!=="notfound" && (h!=="fit" || BRAND.features.virtualFit)) html = V[h]();
  else html = V.notfound();
  const changed = h !== curRoute;
  curRoute = h;
  $("#app").innerHTML = html;
  $$("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#"+h || (h.startsWith("p-") && a.getAttribute("href")==="#"+(byId(h.slice(2))||{}).c)));
  if(changed){ window.scrollTo({top:0, behavior:"instant"}); }
  setupMbar(h);
  closeAll();
}

    m.innerHTML = `<div style="min-width:0;flex:1"><div style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(tx(p.n))}</div>${priceHTML(p)}</div><button class="btn btn-light" data-act="addPdp">${t("add")}</button>`;
    document.body.classList.add("has-mbar");
  } else { m.innerHTML = ""; m.classList.remove("show"); document.body.classList.remove("has-mbar"); }
}
function rerender(){ const y = scrollY; curRoute = (location.hash||"#home").slice(1)||"home"; route(); window.scrollTo({top:y, behavior:"instant"}); }

/* ---------- chrome ---------- */
function chrome(){
  document.documentElement.lang = L;
  document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("#ribbon").innerHTML = t("ribbon");
  $("#logo").innerHTML = `${esc(kitState.name)}<sup>™</sup>`;
  $("#nav").innerHTML = t("nav").map(n=>`<a href="#${n[0]}">${L==="ar"?n[1]:n[2]}</a>`).join("");
  $("#langBtn").textContent = L === "ar" ? "EN" : "عربي";
  $("#langBtn").setAttribute("aria-label", L === "ar" ? "Switch to English" : "التبديل للعربية");
  $("#openSearch").setAttribute("aria-label", tx(["بحث","Search"]));
  $("#openBag").setAttribute("aria-label", t("bagT"));
  $("#accLink").setAttribute("aria-label", t("account"));
  $("#wishLink").setAttribute("aria-label", t("wishlist"));
  $("#kitBtn span").textContent = t("kit"); $("#kitBtn").setAttribute("aria-label", t("kit"));
  $("#footer").innerHTML = `<div class="ftr">${arcs("soft")}<div class="wrap" style="position:relative">
    <div class="cols">
      <div><a href="#home" class="logo">${esc(kitState.name)}<sup>™</sup></a><p class="about">${t("fAbout")}</p></div>
      <div><h4>${t("fShop")}</h4><ul>${t("nav").map(n=>`<li><a href="#${n[0]}">${L==="ar"?n[1]:n[2]}</a></li>`).join("")}<li><a href="#accessories">${tx(["الإكسسوارات","Accessories"])}</a></li></ul></div>
      <div><h4>${t("fHelp")}</h4><ul><li><a href="#contact">${t("contact")}</a></li><li><a href="#contact">${t("faq")}</a></li><li><a href="#contact">${t("shippingL")}</a></li><li><a href="#account">${t("account")}</a></li></ul></div>
      <div><h4>${t("fHouse")}</h4><ul><li><a href="#about">${t("about")}</a></li><li><a href="#collections">${t("collT")}</a></li><li><a href="#wishlist">${t("wishlist")}</a></li></ul></div>
    </div>
    <div class="base"><span>${t("rights")}</span><div class="pay"><span>VISA</span><span>Mastercard</span><span>Apple Pay</span><span>COD</span></div></div>
  </div></div>`;
  applyKit();
  counts();
}
function counts(){
  const n = bag.reduce((a,l)=>a+l.qty,0);
  $("#bagCount").textContent = n;
  const w = $("#wishCount"); w.textContent = wish.length; w.hidden = !wish.length;
}
function save(){ store.set("bag", bag); store.set("wish", wish); store.set("orders", orders); store.set("user", user); counts(); }

/* ---------- overlays ---------- */
let lastFocus = null;
function openLayer(el){ lastFocus = document.activeElement; closeAll(true); el.classList.add("show"); $("#scrim").classList.add("show"); document.body.style.overflow="hidden"; setTimeout(()=>{ const f = el.querySelector("input,button,a"); f && f.focus({preventScroll:true}) }, 60); }
function closeAll(keepFocus){ $$(".drawer.show,.search.show").forEach(e=>e.classList.remove("show")); $("#scrim").classList.remove("show"); if(!$("#film").classList.contains("show")) document.body.style.overflow=""; if(!keepFocus && lastFocus){ try{lastFocus.focus({preventScroll:true})}catch(e){} lastFocus=null } }

function renderBag(){
  const {sub} = totals();
  const left = Math.max(0, BRAND.freeShipping - sub);
  $("#bag").innerHTML = `<div class="dh"><h2 id="bagTitle">${t("bagT")} <span class="mute num" style="font-size:14px">(${bag.reduce((a,l)=>a+l.qty,0)})</span></h2><button class="circ" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  ${bag.length?`<div class="db"><div class="ship">${left?t("toFree").replace("{x}",`<b class="num" style="color:var(--bone)">${money(left)}</b>`):t("gotFree")}<div class="bar"><i style="width:${Math.min(100,sub/BRAND.freeShipping*100)}%"></i></div></div>
    ${bag.map((l,i)=>{const p=byId(l.id);return `<div class="line"><a href="#p-${p.id}"><img src="${img(p.id)}" alt=""></a><div><h4>${esc(tx(p.n))}</h4><small>${colorName(l.color)} · ${sizeLabel(l.size)}</small>
      <div class="mini"><button data-bq="${i}:-1" aria-label="-">${ico("minus")}</button><span>${l.qty}</span><button data-bq="${i}:1" aria-label="+">${ico("plus")}</button></div></div>
      <div class="end">${priceHTML({p:p.p*l.qty, was:p.was?p.was*l.qty:0})}<button class="rm" data-brm="${i}">${t("remove")}</button></div></div>`}).join("")}</div>
  <div class="df"><div class="tot num"><span>${t("subtotal")}</span><b>${money(sub)}</b></div><a class="btn btn-light btn-block" href="#checkout">${t("checkout")} ${arrow()}</a><button class="btn btn-ghost btn-block" data-act="close">${t("keep")}</button></div>`
  :`<div class="db"><div class="empty" style="margin-top:20px">${ico("bag")}<b>${t("bagEmpty")}</b><p>${t("bagEmptyP")}</p><a class="btn btn-light" href="#new">${t("shopNew")} ${arrow()}</a></div></div>`}`;
}
function openBag(){ renderBag(); openLayer($("#bag")); }

function renderMenu(){
  $("#menu").innerHTML = `<div class="dh"><a class="logo" href="#home">${esc(kitState.name)}</a><button class="circ" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="db"><nav class="mnav">${t("nav").map(n=>`<a href="#${n[0]}">${L==="ar"?n[1]:n[2]} ${arrow()}</a>`).join("")}<a href="#accessories">${tx(["الإكسسوارات","Accessories"])} ${arrow()}</a></nav>
  <div style="display:grid;gap:14px;margin-top:28px;font-size:15px"><a href="#account" style="display:flex;gap:12px">${ico("user")} ${t("account")}</a><a href="#wishlist" style="display:flex;gap:12px">${ico("heart")} ${t("wishlist")} <span class="mute num">(${wish.length})</span></a><a href="#about" class="mute">${t("about")}</a><a href="#contact" class="mute">${t("contact")}</a></div></div>`;
}
function renderSearch(){
  $("#search").innerHTML = `<div class="wrap"><div class="sbox">${ico("search")}<label class="sr" for="sInput">${tx(["بحث","Search"])}</label><input id="sInput" type="search" placeholder="${t("searchPh")}" autocomplete="off"><button class="circ" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="shint">${t("popular")} ${t("popularList").map(x=>`<button class="chip" data-q="${L==="ar"?x[0]:x[1]}">${L==="ar"?x[0]:x[1]}</button>`).join("")}</div><div id="sResults"></div></div>`;
  searchResults("");
}
function searchResults(q){
  const ql = q.trim().toLowerCase();
  const res = ql ? P.filter(p => (p.n[0]+" "+p.n[1]+" "+p.t+" "+p.c).toLowerCase().includes(ql)) : P.filter(p=>p.tag==="new").slice(0,4);
  $("#sResults").innerHTML = `${ql?`<p class="mute" style="margin-top:18px;font-size:13px"><span class="num">${res.length}</span> ${t("resultsFor")}</p>`:""}
  ${res.length?`<div class="sres">${res.slice(0,8).map(cardHTML).join("")}</div>`:`<div class="empty" style="margin-top:20px"><b>${t("noResults")}</b></div>`}`;
}
function openSearch(){ renderSearch(); openLayer($("#search")); setTimeout(()=>$("#sInput")&&$("#sInput").focus(),80); }

function renderKit(){
  $("#kit").innerHTML = `<div class="dh"><h2>${t("kitT")}</h2><button class="circ" data-act="close" aria-label="${t("close")}">${ico("x")}</button></div>
  <div class="db kit"><p>${t("kitP")}</p>
    <div><h4><label for="kitName">${t("kitName")}</label></h4><div class="form" style="grid-template-columns:1fr"><input id="kitName" value="${esc(kitState.name)}" maxlength="18"></div></div>
    <div><h4>${t("kitAcc")}</h4><div class="accs">${ACCENTS.map(a=>`<button class="${kitState.accent===a[0]?"on":""}" style="background:${a[0]}" data-accent="${a[0]}" aria-label="${a[1]}" title="${a[1]}"></button>`).join("")}</div></div>
    <div class="hr"></div><button class="btn btn-ghost" data-act="kitReset">${t("kitReset")}</button></div>`;
}
function applyKit(){
  const hex = kitState.accent.replace("#","");
  const rgb = [0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)).join(",");
  document.documentElement.style.setProperty("--glow", kitState.accent);
  document.documentElement.style.setProperty("--glow-rgb", rgb);
  $$(".logo").forEach(l=>l.innerHTML = `${esc(kitState.name)}${l.closest(".dh")?"":"<sup>™</sup>"}`);
}

/* lookbook film */
let filmI = 0, filmTimer = null;
function openFilm(start=0){
  const looks = t("watchLooks");
  $("#film").innerHTML = `${looks.map((x,i)=>`<div class="slide" data-s="${i}"><img src="img/${x[2]}.webp" alt=""></div>`).join("")}
    <div class="bars">${looks.map(()=>"<i><b></b></i>").join("")}</div>
    <button class="nav-l" data-fstep="-1" aria-label="prev"></button><button class="nav-r" data-fstep="1" aria-label="next"></button>
    <button class="circ x" data-act="closeFilm" aria-label="${t("close")}">${ico("x")}</button>
    <div class="cap"><div><div class="eyebrow" style="margin-bottom:10px">${t("seasonT")}</div><h3 id="filmT"></h3></div><a class="btn btn-light" id="filmShop">${t("shopLook")} ${arrow()}</a></div>`;
  $("#film").classList.add("show"); document.body.style.overflow="hidden";
  filmGo(start);
  $("#film .x").focus();
}
function filmGo(i){
  const looks = t("watchLooks"); filmI = (i + looks.length) % looks.length;
  $$("#film .slide").forEach((s,n)=>s.classList.toggle("on", n===filmI));
  $$("#film .bars i").forEach((b,n)=>{ b.className = n<filmI?"done":""; });
  const bar = $$("#film .bars i")[filmI]; void bar.offsetWidth; bar.className = "run";
  $("#filmT").textContent = tx(looks[filmI].slice(0,2));
  const pid = looks[filmI][2];
  const sh = $("#filmShop"); sh.href = "#p-"+pid;
  clearTimeout(filmTimer); filmTimer = setTimeout(()=>filmGo(filmI+1), 5000);
}
function closeFilm(){ clearTimeout(filmTimer); $("#film").classList.remove("show"); $("#film").innerHTML=""; document.body.style.overflow=""; }

/* toast */
let toastT;
function toast(msg, action){
  const el = $("#toast"); el.querySelector("span").textContent = msg;
  const b = el.querySelector("button");
  if(action){ b.hidden=false; b.textContent = action[0]; b.onclick = ()=>{ el.classList.remove("show"); action[1]() } } else b.hidden = true;
  el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), 3200);
}

/* bag ops */
function addToBag(id, size, color, qty=1){
  const i = bag.findIndex(l=>l.id===id && l.size===size && l.color===color);
  if(i>-1) bag[i].qty += qty; else bag.unshift({id,size,color,qty});
  save();
  const b = $("#openBag"); b.animate([{transform:"scale(1)"},{transform:"scale(1.25)"},{transform:"scale(1)"}],{duration:420});
  toast(`${t("added")}: ${tx(byId(id).n)}`, [t("viewBag"), openBag]);
}
function toggleWish(id){
  const i = wish.indexOf(id);
  if(i>-1){ wish.splice(i,1); toast(t("removedW")) } else { wish.unshift(id); toast(t("savedW")) }
  save();
  $$(`[data-wish="${id}"]`).forEach(b=>{ const on = wish.includes(id); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on) });
  if(curRoute==="wishlist" || (curRoute==="account" && accTab==="wish")) rerender();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const d = e.target.closest("[data-act],[data-wish],[data-quick],[data-type],[data-fsize],[data-fcolor],[data-fprice],[data-img],[data-pcolor],[data-psize],[data-pqty],[data-bq],[data-brm],[data-film],[data-fstep],[data-q],[data-accent],[data-acc],[data-auth]");
  if(e.target.closest("a[href^='#']") && !d){ /* plain nav: route() closes overlays */ if(e.target.closest("a").getAttribute("href")===location.hash){ closeAll(); window.scrollTo({top:0}) } return; }
  if(!d) return;
  const ds = d.dataset;
  if(ds.wish){ e.preventDefault(); return toggleWish(ds.wish) }
  if(ds.quick){ const p = byId(ds.quick); return addToBag(p.id, p.s.find(s=>!(p.out||[]).includes(s)), p.col[0]) }
  if(ds.type){ shopState.type = ds.type; return rerender() }
  if(ds.fsize){ const a = shopState.sizes; a.includes(ds.fsize)?a.splice(a.indexOf(ds.fsize),1):a.push(ds.fsize); return rerender() }
  if(ds.fcolor){ const a = shopState.colors; a.includes(ds.fcolor)?a.splice(a.indexOf(ds.fcolor),1):a.push(ds.fcolor); return rerender() }
  if(ds.fprice){ shopState.price = shopState.price===ds.fprice?"":ds.fprice; return rerender() }
  const pid = curRoute.startsWith("p-") ? curRoute.slice(2) : null;
  if(ds.img && pid){ pdpState[pid].img = +ds.img; return rerender() }
  if(ds.pcolor && pid){ pdpState[pid].color = ds.pcolor; return rerender() }
  if(ds.psize && pid){ pdpState[pid].size = ds.psize; return rerender() }
  if(ds.pqty && pid){ pdpState[pid].qty = Math.max(1, Math.min(9, pdpState[pid].qty + +ds.pqty)); return rerender() }
  if(ds.bq){ const [i,dlt] = ds.bq.split(":").map(Number); bag[i].qty += dlt; if(bag[i].qty<1) bag.splice(i,1); save(); return renderBag() }
  if(ds.brm){ bag.splice(+ds.brm,1); save(); return renderBag() }
  if(ds.film!==undefined){ return openFilm(+ds.film) }
  if(ds.fstep){ return filmGo(filmI + +ds.fstep) }
  if(ds.q){ const i=$("#sInput"); i.value = ds.q; searchResults(ds.q); i.focus(); return }
  if(ds.accent){ kitState.accent = ds.accent; store.set("kit", kitState); applyKit(); return renderKit() }
  if(ds.acc){ accTab = ds.acc; return rerender() }
  if(ds.auth){ authTab = ds.auth; return rerender() }
  switch(ds.act){
    case "close": return closeAll();
    case "closeFilm": return closeFilm();
    case "toggleFilters": shopState.open = !shopState.open; return rerender();
    case "clearFilters": Object.assign(shopState,{sizes:[],colors:[],price:"",type:"all"}); return rerender();
    case "addPdp": {
      const st = pdpState[pid], p = byId(pid);
      if(!st.size){ const er=$("#sizeErr"); er.hidden=false; er.scrollIntoView({block:"center",behavior:"smooth"}); return }
      return addToBag(pid, st.size, st.color, st.qty);
    }
    case "sizeGuide": { const f=$("#fitAcc"); f.open=true; f.scrollIntoView({block:"center",behavior:"smooth"}); return }
    case "coBack": coState.step--; return rerender();
    case "signOut": user=null; save(); return rerender();
    case "kitReset": kitState = {name:BRAND.name, accent:BRAND.accent}; store.set("kit",kitState); applyKit(); renderKit(); return;
  }
});
document.addEventListener("change", e => {
  if(e.target.id==="sortSel"){ shopState.sort = e.target.value; rerender() }
  if(e.target.name==="ship"){ coState.ship = e.target.value; rerender() }
  if(e.target.name==="pay"){ coState.pay = e.target.value; rerender() }
});
document.addEventListener("input", e => {
  if(e.target.id==="sInput") searchResults(e.target.value);
  if(e.target.id==="kitName"){ kitState.name = (e.target.value.trim()||BRAND.name).toUpperCase(); store.set("kit",kitState); applyKit() }
  if(e.target.classList.contains("bad")) e.target.classList.remove("bad");
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  const need = (ids, errId) => { let ok = true; ids.forEach(id=>{ const el=$("#"+id); if(el && !el.value.trim() || (el && el.type==="email" && !/^\S+@\S+\.\S+$/.test(el.value))){ el.classList.add("bad"); ok=false } }); $("#"+errId).hidden = ok; return ok };
  if(f==="news"){ const i=e.target.querySelector("input"); if(!/^\S+@\S+\.\S+$/.test(i.value)){ i.focus(); return } i.value=""; return toast(t("subscribed")) }
  if(f==="contact"){ if(!need(["ct_n","ct_e","ct_m"],"ctErr")) return; e.target.reset(); return toast(t("sent")) }
  if(f==="auth"){ if(!need(["au_e","au_p"].concat(authTab==="up"?["au_n"]:[]),"auErr")) return; const em=$("#au_e").value.trim(); user={email:em, name: authTab==="up"?$("#au_n").value.trim():em.split("@")[0]}; save(); return rerender() }
  if(f==="co"){
    if(coState.step===0){
      const ids=["fn","ln","em","ph","ad","ci"];
      ids.forEach(id=>coState.info[id]=$("#co_"+id).value.trim()); coState.info.co=$("#co_co").value;
      if(!need(ids.map(i=>"co_"+i),"coErr")) return;
    }
    if(coState.step<2){ coState.step++; rerender(); window.scrollTo({top:0,behavior:"smooth"}); return }
    const {total} = totals();
    const no = "VA-" + (10000 + Math.floor(Math.random()*89999));
    orders.unshift({no, date:new Date().toISOString().slice(0,10), items:bag.reduce((a,l)=>a+l.qty,0), total, pay:coState.pay});
    if(!user && coState.info.em) user = {email:coState.info.em, name:coState.info.fn};
    bag = []; save(); coState.step = 0;
    location.hash = "confirmed";
  }
});
document.addEventListener("keydown", e => {
  if(e.key==="Escape"){ if($("#film").classList.contains("show")) closeFilm(); else closeAll() }
  if($("#film").classList.contains("show")){ if(e.key==="ArrowRight") filmGo(filmI+(L==="ar"?-1:1)); if(e.key==="ArrowLeft") filmGo(filmI+(L==="ar"?1:-1)) }
});
document.addEventListener("mousemove", e => {
  const m = e.target.closest(".main-img.zoom"); if(!m) return;
  const r = m.getBoundingClientRect(); const im = m.querySelector("img");
  im.style.transformOrigin = `${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;
});
document.addEventListener("click", e => { const m = e.target.closest(".main-img"); if(m){ m.classList.toggle("zoom"); if(!m.classList.contains("zoom")) rerender() } });

$("#scrim").onclick = () => closeAll();
$("#openBag").onclick = openBag;
$("#openSearch").onclick = openSearch;
$("#burger").onclick = () => { renderMenu(); openLayer($("#menu")) };
$("#kitBtn").onclick = () => { renderKit(); openLayer($("#kit")) };
$("#langBtn").onclick = () => { L = L==="ar"?"en":"ar"; store.set("lang", L); chrome(); rerender() };
window.addEventListener("scroll", () => {
  $("#hdr").classList.toggle("solid", scrollY > 10);
  const m = $("#mbar"); if(m.innerHTML){ const b = $("#addBtn"); m.classList.toggle("show", b ? b.getBoundingClientRect().bottom < 0 : false) }
}, {passive:true});
window.addEventListener("hashchange", route);

chrome();
route();
</script>
