<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Shop | Maison Verrel</title>
<link rel="preconnect" href="https://images.higgs.ai">
<link rel="stylesheet" href="store.css?v=1">
</head>
<body>
<div id="hd"></div>
<main class="wrap">
<div class="crumb"><a href="index.html">Home</a> / Shop</div>
<h1 class="t" id="ttl">The Collection</h1>
<p class="sub">Atelier pieces cut from silk and wool, and the everyday basics that go with them.</p>
<div class="bar"><div class="chips" id="chips" role="group" aria-label="Filter by category"></div><label style="margin:0;display:flex;gap:10px;align-items:center">Sort <select id="sort"><option value="feat">Featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="new">New in</option></select></label></div>
<div class="grid" id="grid"></div>
</main>
<div id="ft"></div>
<div class="toast" id="toast" role="status"></div>
<script src="store.js?v=1"></script>
<script>
MV.chrome('shop');
var cats=['All','Atelier','Knitwear','Shirts','Trousers','Jackets','Basics','Accessories'],cur=new URLSearchParams(location.search).get('c')||'All',sort='feat';
if(cats.indexOf(cur)<0)cur='All';
var chips=document.getElementById('chips'),grid=document.getElementById('grid');
chips.innerHTML=cats.map(function(c){return '<button class="chip" data-c="'+c+'" aria-pressed="false">'+c+'</button>'}).join('');
function card(p){var tag=p.was?'<span class="badge s">-'+Math.round((1-p.price/p.was)*100)+'%</span>':(p.isNew?'<span class="badge">New</span>':'');
 var im=p.rail?'':'<img src="img/'+p.id+'.webp" alt="'+MV.esc(p.name)+'" loading="lazy">';
 var pr=p.was?'<span class="price"><del>'+MV.money(p.was)+'</del><span class="now">'+MV.money(p.price)+'</span></span>':'<span class="price">'+MV.money(p.price)+'</span>';
 return '<a class="card" href="product.html?id='+p.id+'"><div class="im"'+(p.rail?' data-r="'+p.id+'"':'')+'>'+tag+im+'</div><h3>'+MV.esc(p.name)+'</h3><div class="meta">'+(p.sub||p.cat)+'</div>'+pr+'</a>'}
function draw(){
 var l=MV.CATALOG.filter(function(p){return cur==='All'||p.cat===cur});
 if(sort==='lo')l.sort(function(a,b){return a.price-b.price});else if(sort==='hi')l.sort(function(a,b){return b.price-a.price});else if(sort==='new')l.sort(function(a,b){return b.isNew-a.isNew});
 grid.innerHTML=l.length?l.map(card).join(''):'<p class="empty">Nothing here yet.</p>';
 [].forEach.call(chips.children,function(b){b.setAttribute('aria-pressed',String(b.dataset.c===cur))});
 document.getElementById('ttl').textContent=cur==='All'?'The Collection':cur;
 [].forEach.call(grid.querySelectorAll('[data-r]'),function(im){var p=MV.BYID[im.dataset.r],w=Math.min(im.clientWidth*.86,im.clientHeight*.88/MV.faceRatio(p,'front'));im.insertAdjacentHTML('beforeend',MV.face(p,'front',w))})
}
chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;cur=b.dataset.c;history.replaceState(null,'','?c='+cur);draw()});
document.getElementById('sort').addEventListener('change',function(){sort=this.value;draw()});
draw();addEventListener('resize',draw);
</script>
</body></html>
