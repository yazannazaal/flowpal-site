<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1F26">
<meta name="description" content="مساحة عمل فريق Flowpal">
<title>Flowpal</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flowpal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <a class="brand" href="#/" aria-label="Flowpal">
      <img src="./icons/icon-192.png" alt="" width="28" height="28">
      <span>Flowpal</span>
    </a>
    <nav class="tabs hidden" id="tabs" aria-label="الأقسام"></nav>
    <span class="spacer"></span>
    <button class="acct hidden" id="btnAcct" type="button" aria-haspopup="dialog">
      <span class="acct-i" id="acctInitial" aria-hidden="true"></span><span class="acct-n" id="acctName"></span>
    </button>
  </div>
</header>
<div class="demo-flag hidden" id="demoFlag"></div>

<main id="app" aria-live="polite"><p class="muted boot">جارِ التحميل…</p></main>

<dialog id="acctDlg" aria-labelledby="acctTitle">
  <h2 id="acctTitle">حسابي</h2>
  <p class="muted small" style="margin:4px 0 0"><span id="acctWho"></span><br><span class="ltr" id="acctEmail"></span></p>
  <form id="pwForm" novalidate>
    <label class="f" for="pw1">كلمة مرور جديدة (8 أحرف على الأقل)</label>
    <input class="i ltr" id="pw1" type="password" minlength="8" autocomplete="new-password">
    <label class="f" for="pw2">أعد كتابتها</label>
    <input class="i ltr" id="pw2" type="password" minlength="8" autocomplete="new-password">
    <div class="err" id="pwErr" role="alert"></div>
    <button class="btn-line" type="submit" id="pwSave">تغيير كلمة المرور</button>
  </form>
  <div class="row-btns">
    <button class="btn danger" type="button" id="btnOut">تسجيل الخروج</button>
    <button class="btn-line" type="button" id="acctClose">إغلاق</button>
  </div>
  <p class="muted small" style="margin:10px 0 0">الخروج يمسح بيانات التطبيق المحفوظة على هذا الجهاز.</p>
</dialog>

<script type="module" src="./shell.js"></script>
</body>
</html>
