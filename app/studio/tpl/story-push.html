<!doctype html>
<!-- Template: Story - new post push, 1080x1920. "post" = path to the post PNG (shown as a tilted card).
     In the app: reshare the post on top of the card, or add a link sticker. Empty "post" = labelled placeholder. -->
<html lang="ar" dir="rtl" data-size="1080x1920">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { position: relative; }
  .story-safe { justify-content: center; gap: 44px; }
  .h1 { font-size: 70px; }
  .post { align-self: center; width: 600px; aspect-ratio: 4 / 5; border-radius: 32px; overflow: hidden; transform: rotate(-2.5deg);
    box-shadow: 0 30px 80px rgba(0,0,0,.35); background: var(--ink-2); position: relative; flex: none; }
  .post img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post.empty { background: repeating-linear-gradient(135deg, #D5DCE5 0 2px, #E6EBF1 2px 28px); }
  .post.empty::after { content: "مكان البوست"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; color: var(--gray); font-weight: 600; }
  .cta { align-self: center; }
</style></head>
<body class="{{theme}}" style="--guides:{{guides_display}}">
  <div class="story-safe">
    <span class="eyebrow teal" style="align-self:flex-start">{{eyebrow}}</span>
    <h1 class="h1">{{headline}}</h1>
    <div class="post {{post_class}}">{{post_img}}</div>
    <span class="pill teal cta">{{cta}}</span>
  </div>
  <div class="story-sig"><img src="{{logo}}" alt="FlowPal"><span class="handle">{{handle}}</span></div>
  <div class="gz"><div style="top:0;left:0;right:0;height:250px"></div><div style="bottom:0;left:0;right:0;height:340px"></div></div>
</body></html>
