<!doctype html>
<!-- Template: chat scene (problem or solution). Base 1080x1350; also renders 1080x1080. -->
<html lang="ar" dir="rtl" data-size="1080x1350">
<head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body { position: relative; }
  .wrap { position: absolute; inset: 0; padding: 88px var(--m) 168px; display: flex; flex-direction: column; gap: 44px; }
  .top { display: flex; flex-direction: column; align-items: flex-start; gap: 30px; }
  .chat { flex: 1; min-height: 0; }
  .msgs { justify-content: flex-end; min-height: 0; overflow: hidden; }
  /* square (1080x1080 / 1200x1200): tighter, newest messages win */
  @media (max-aspect-ratio: 1/1.1) { }
  @media (min-aspect-ratio: 1/1.1) {
    .wrap { padding-top: 64px; gap: 30px; }
    .h1 { font-size: 64px; }
    .day { display: none; }
    .chat-head { display: none; }
    .msgs { padding: 20px 28px 24px; gap: 12px; }
    .msg { font-size: 30px; padding: 12px 22px 10px; }
  }
</style></head>
<body class="{{theme}}">
  <div class="wrap">
    <div class="top">
      <span class="eyebrow {{tone}}">{{eyebrow}}</span>
      <h1 class="h1">{{headline}}</h1>
    </div>
    <div class="chat">
      <div class="chat-head"><div class="av">{{contact_initial}}</div><div><b>{{contact}}</b><span class="{{status_class}}">{{channel}}</span></div></div>
      <div class="msgs">{{chat}}</div>
    </div>
  </div>
  <div class="sig"><img src="{{logo}}" alt="FlowPal"><span class="handle">{{handle}}</span></div>
</body></html>
